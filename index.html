<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>梁哥组主管系统</title>
<style>
:root{
--bg:#eef1f8;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--faint:#86868b;
--line:#e6e8f0;--blue:#0071e3;--blue-bg:#e8f1ff;--green:#34c759;--green-bg:#e7f9ec;
--orange:#ff9f0a;--orange-bg:#fff3da;--purple:#7c5cff;--purple-bg:#efeaff;
--red:#ff3b30;--pink:#ff2d55;
--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.05);
--radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
radial-gradient(900px 520px at 12% 6%,rgba(0,113,227,.10),transparent 60%),
radial-gradient(820px 620px at 90% 10%,rgba(124,92,255,.10),transparent 60%),
radial-gradient(900px 720px at 48% 100%,rgba(50,173,230,.08),transparent 60%);
background-size:200% 200%;animation:flowbg 20s ease-in-out infinite}
@keyframes flowbg{0%{background-position:0% 0%}50%{background-position:100% 50%}100%{background-position:0% 0%}}
.num{font-variant-numeric:tabular-nums}

/* Login */
.login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
background:radial-gradient(1200px 600px at 20% 10%,#1d4ed8 0%,transparent 55%),radial-gradient(1000px 700px at 90% 90%,#7c3aed 0%,transparent 50%),linear-gradient(135deg,#0b1120,#101a3a)}
.login-card{width:400px;max-width:92vw;background:rgba(255,255,255,.9);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.5);border-radius:24px;padding:36px 32px 28px;box-shadow:0 30px 80px rgba(0,0,0,.45);text-align:center}
.login-logo{width:80px;height:80px;margin:0 auto 14px;background:url('logo.png') center/contain no-repeat;display:block}
.login-card h1{font-size:21px;font-weight:700;letter-spacing:.3px}
.login-card .sub{color:var(--sub);font-size:12.5px;margin:6px 0 20px}
.login-card input{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;padding:0 14px;font-size:15px;margin-bottom:10px;background:#fff;outline:none;transition:.15s}
.login-card input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-bg)}
.login-card button{width:100%;height:46px;border:none;border-radius:11px;background:var(--blue);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
.login-card button:hover{background:#0077ed;transform:translateY(-1px)}
.login-card button:disabled{opacity:.6;cursor:default;transform:none}
.login-err{color:var(--red);font-size:12.5px;min-height:16px;margin-top:8px}
.login-hint{color:var(--faint);font-size:11.5px;margin-top:14px;line-height:1.7}

/* App layout */
#app{display:none;min-height:100vh}
.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;background:rgba(245,245,247,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line);z-index:10}
.brand{display:flex;align-items:center;gap:10px}
.brand .lg{width:38px;height:38px;background:url('logo.png') center/contain no-repeat;display:inline-block}
.brand b{font-size:14px;letter-spacing:.4px}
.brand span{font-size:11px;color:var(--faint)}
.user{display:flex;align-items:center;gap:10px}
.user .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#ff9f0a,#ff3b30);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.user .info{display:flex;flex-direction:column;align-items:flex-end}
.user .info b{font-size:13px}
.user .info i{font-size:11px;color:var(--faint);font-style:normal}
.btn-sm{height:32px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12.5px;cursor:pointer;transition:.15s;color:var(--ink)}
.btn-sm:hover{border-color:var(--blue);color:var(--blue)}
.btn-blue{background:var(--blue);color:#fff;border:none}
.btn-blue:hover{background:#0077ed;color:#fff}
.btn-green{background:var(--green);color:#fff;border:none}
.btn-green:hover{background:#2bb24c;color:#fff}

/* Content */
.content{max-width:1200px;margin:0 auto;padding:22px}
.page-title{font-size:22px;font-weight:700;margin-bottom:4px}
.page-desc{color:var(--sub);font-size:13px;margin-bottom:20px}

/* KPI cards */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.kpi .label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--sub);margin-bottom:8px}
.kpi .label .dot{width:7px;height:7px;border-radius:50%}
.kpi .val{font-size:28px;font-weight:700;letter-spacing:-.5px}
.kpi .val .u{font-size:14px;font-weight:500;color:var(--faint);margin-left:3px}
.kpi .sub{font-size:11.5px;color:var(--faint);margin-top:4px}

/* Comparison arrows (boss view) */
.arrow-up{color:var(--green);font-weight:600}
.arrow-down{color:var(--red);font-weight:600}
.arrow-flat{color:var(--faint);font-weight:600}
.compare-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:1px 6px;border-radius:10px;margin-left:6px}
.compare-badge.up{background:var(--green-bg);color:var(--green)}
.compare-badge.down{background:#fff0f0;color:var(--red)}
.compare-badge.flat{background:var(--bg);color:var(--faint)}

/* Group card (boss view) */
.group-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.group-card .gc-head{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:.15s}
.group-card .gc-head:hover{background:#fafafe}
.group-card .gc-info{display:flex;align-items:center;gap:14px}
.group-card .gc-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.group-card .gc-name{font-size:17px;font-weight:700}
.group-card .gc-meta{font-size:12px;color:var(--faint)}
.group-card .gc-stats{display:flex;gap:24px}
.group-card .gc-stat{text-align:center}
.group-card .gc-stat .sv{font-size:20px;font-weight:700}
.group-card .gc-stat .sl{font-size:11px;color:var(--sub)}
.group-card .gc-arrow{font-size:18px;color:var(--faint);transition:.2s}
.group-card.open .gc-arrow{transform:rotate(180deg)}
.group-card .gc-body{display:none;padding:0 20px 20px}
.group-card.open .gc-body{display:block}

/* Nested TL list inside group */
.nested-tl{background:var(--bg);border-radius:12px;padding:14px;margin-bottom:10px}
.nested-tl .nt-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;cursor:pointer}
.nested-tl .nt-head b{font-size:14px}
.nested-tl .nt-head .nt-meta{font-size:11px;color:var(--faint)}
.nested-tl .nt-stats{display:flex;gap:16px;font-size:12px;margin-bottom:8px}
.nested-tl .nt-stats span{color:var(--sub)}
.nested-tl .nt-stats b{font-weight:600}
.nested-tl .nt-members{display:none;padding:8px 0 0;border-top:1px solid var(--line);margin-top:8px}
.nested-tl.open .nt-members{display:block}
.nested-member{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
.nested-member .nm-name{font-weight:500}
.nested-member .nm-stats{display:flex;gap:12px;color:var(--sub)}

/* TL card (supervisor view) */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-bottom:22px}
.tl-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;transition:.2s;cursor:pointer;border:2px solid transparent}
.tl-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.tl-card .tl-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.tl-card .tl-name{font-size:17px;font-weight:700}
.tl-card .tl-sub{font-size:12px;color:var(--faint);margin-top:2px}
.tl-card .tl-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.tl-card .tl-stat{text-align:center}
.tl-card .tl-stat .sv{font-size:20px;font-weight:700}
.tl-card .tl-stat .sl{font-size:11px;color:var(--sub);margin-top:2px}
.tl-card .tl-btns{display:flex;gap:8px}
.tl-card .tl-btns button{flex:1;height:36px;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.tl-card .enter-btn{background:var(--blue);color:#fff}
.tl-card .enter-btn:hover{background:#0077ed}
.tl-card .enter-btn:disabled{opacity:.5}
.tl-card .hist-btn{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.tl-card .hist-btn:hover{border-color:var(--blue)}

/* Member card (team leader view) */
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:22px}
.member-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px;transition:.2s;border:2px solid transparent}
.member-card:hover{border-color:var(--green);transform:translateY(-1px)}
.member-card .mc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.member-card .mc-name{font-size:15px;font-weight:600}
.member-card .mc-sub{font-size:11px;color:var(--faint)}
.member-card .mc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.member-card .mc-stat{text-align:center}
.member-card .mc-stat .sv{font-size:17px;font-weight:700}
.member-card .mc-stat .sl{font-size:10px;color:var(--sub)}
.member-card .mc-btns{display:flex;gap:6px}
.member-card .mc-btns button{flex:1;height:32px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.member-card .mc-enter{background:var(--green);color:#fff}
.member-card .mc-enter:hover{background:#2bb24c}
.member-card .mc-del{background:#fff0f0;color:var(--red);border:1px solid #ffcfcf}
.member-card .mc-del:hover{background:#ffe5e5}

/* Table */
.table-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px}
.table-card .tc-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.table-card .tc-head h3{font-size:15px;font-weight:600}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:12px;color:var(--sub);font-weight:600;border-bottom:1px solid var(--line);background:#fafafe}
td{padding:12px 16px;font-size:13.5px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafe}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
.tag-blue{background:var(--blue-bg);color:var(--blue)}
.tag-green{background:var(--green-bg);color:var(--green)}
.tag-orange{background:var(--orange-bg);color:var(--orange)}
.tag-purple{background:var(--purple-bg);color:var(--purple)}

/* Empty state */
.empty{text-align:center;padding:50px 20px;color:var(--faint)}
.empty .icon{font-size:40px;margin-bottom:10px}
.empty p{font-size:14px;margin-bottom:16px}

/* Modal */
@keyframes modalItemIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease}
.modal-overlay.show{opacity:1;visibility:visible}
.modal{background:#fff;border-radius:20px;padding:0;width:480px;max-width:92vw;max-height:90vh;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.3);opacity:0;visibility:hidden;transform:translate(-50%,-50%) translateY(-20px) scale(.94);transform-origin:center center;position:fixed;top:50%;left:50%;transition:opacity .35s cubic-bezier(.22,.61,.36,1),visibility .35s,transform .35s cubic-bezier(.22,.61,.36,1),left .15s ease,top .15s ease}
.modal-overlay.show .modal{opacity:1;visibility:visible;transform:translate(-50%,-50%) translateY(0) scale(1)}
.modal.dragging{transition:opacity .35s,visibility .35s,transform 0s,left 0s,top 0s;left:var(--drag-x,auto);top:var(--drag-y,auto);transform:translate(0,0) scale(1)}
.modal-overlay.show .modal.dragging{transform:translate(0,0) scale(1)}
.modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#fff;cursor:grab;user-select:none;-webkit-user-select:none;border-radius:20px 20px 0 0;position:sticky;top:0;z-index:1}
.modal-header:active{cursor:grabbing}
.modal-header h3{font-size:17px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
.modal-header .drag-hint{font-size:11px;color:var(--faint);font-weight:400;margin-right:6px;display:flex;align-items:center;gap:3px}
.modal-header .modal-x{width:28px;height:28px;border:none;background:var(--bg);border-radius:8px;font-size:15px;cursor:pointer;color:var(--faint);transition:.15s;display:flex;align-items:center;justify-content:center}
.modal-header .modal-x:hover{background:#e5e5e8;color:var(--ink)}
.modal-body{padding:22px 26px;max-height:calc(90vh - 60px);overflow-y:auto}
.modal-body>*{opacity:0;transform:translateY(8px)}
.modal-overlay.show .modal-body>*{animation:modalItemIn .35s cubic-bezier(.22,.61,.36,1) forwards}
.modal-overlay.show .modal-body>*:nth-child(1){animation-delay:.04s}
.modal-overlay.show .modal-body>*:nth-child(2){animation-delay:.08s}
.modal-overlay.show .modal-body>*:nth-child(3){animation-delay:.12s}
.modal-overlay.show .modal-body>*:nth-child(4){animation-delay:.16s}
.modal-overlay.show .modal-body>*:nth-child(5){animation-delay:.20s}
.modal-overlay.show .modal-body>*:nth-child(6){animation-delay:.24s}
.modal-overlay.show .modal-body>*:nth-child(7){animation-delay:.28s}
.modal-overlay.show .modal-body>*:nth-child(8){animation-delay:.32s}
.modal-body h3{font-size:17px;font-weight:700;margin:0 0 4px}
.modal-body .modal-sub{font-size:13px;color:var(--sub);margin-bottom:16px}
.modal-body .field{margin-bottom:12px}
.modal-body .field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px;font-weight:500}
.modal-body .field input,.modal-body .field select{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font-size:14px;outline:none;transition:.15s;background:#fff}
.modal-body .field input:focus,.modal-body .field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.modal-body .field-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.modal-body .btns{display:flex;gap:10px;margin-top:6px}
.modal-body .btns button{flex:1;height:40px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.modal-body .btn-cancel{background:#f0f0f3;color:var(--sub)}
.modal-body .btn-cancel:hover{background:#e5e5e8}
.modal-body .btn-confirm{background:var(--blue);color:#fff}
.modal-body .btn-confirm:hover{background:#0077ed}
.modal-body .err{color:var(--red);font-size:12.5px;min-height:16px;margin-top:6px}

/* Data entry modal specific */
.entry-modal{width:560px}
.entry-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.entry-stat{background:var(--bg);border-radius:10px;padding:12px;text-align:center}
.entry-stat .es-v{font-size:22px;font-weight:700}
.entry-stat .es-l{font-size:11px;color:var(--sub);margin-top:2px}
.entry-revenue{display:flex;align-items:center;justify-content:space-between;background:var(--purple-bg);border-radius:12px;padding:14px 18px;margin-bottom:16px}
.entry-revenue .er-l{font-size:14px;color:var(--sub)}
.entry-revenue .er-v{font-size:26px;font-weight:700;color:var(--purple)}
.entry-history{margin-top:18px}
.entry-history h4{font-size:14px;font-weight:600;margin-bottom:10px}
.entry-history table{font-size:13px}
.entry-history th{padding:8px 10px;font-size:11px}
.entry-history td{padding:8px 10px}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#1d1d1f;color:#fff;padding:10px 24px;border-radius:24px;font-size:13px;z-index:300;opacity:0;transition:.3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:var(--red)}

/* Workflow bar */
.wf-bar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.04);overflow-x:auto}
.wf-steps{display:flex;align-items:center;gap:6px;min-width:fit-content}
.wf-step{flex-shrink:0}
.wf-step-inner{padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--sub);background:var(--bg);transition:.25s;letter-spacing:.2px;white-space:nowrap}
.wf-step.active .wf-step-inner{color:#fff;background:linear-gradient(135deg,#7c5cff 0%,#5a3fd9 100%);box-shadow:0 4px 12px rgba(124,92,255,.35)}
.wf-arrow{color:var(--faint);font-size:14px;flex-shrink:0;font-weight:700;padding:0 2px;user-select:none}

/* Trend modal */
.trend-modal{width:680px;max-width:95vw}
.trend-tabs{display:flex;gap:0;margin-bottom:16px;background:var(--bg);border-radius:10px;padding:4px}
.trend-tab{flex:1;height:38px;border:none;border-radius:8px;background:transparent;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;transition:.15s}
.trend-tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.trend-month-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.trend-month-bar .mb-nav{display:flex;align-items:center;gap:12px}
.trend-month-bar .mb-btn{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.trend-month-bar .mb-btn:hover{border-color:var(--blue);color:var(--blue)}
.trend-month-bar .mb-label{font-size:15px;font-weight:600;min-width:100px;text-align:center}
.trend-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.trend-badge.up{background:var(--green-bg);color:var(--green)}
.trend-badge.down{background:#fff0f0;color:var(--red)}
.trend-badge.flat{background:var(--bg);color:var(--faint)}
.trend-chart-box{background:var(--bg);border-radius:14px;padding:16px;margin-bottom:14px}
.trend-summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.trend-sum-card{background:var(--bg);border-radius:12px;padding:14px}
.trend-sum-card .tsc-label{font-size:11.5px;color:var(--sub);margin-bottom:6px}
.trend-sum-card .tsc-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.trend-sum-card .tsc-row span:first-child{color:var(--sub)}
.trend-sum-card .tsc-row span:last-child{font-weight:600}

/* Section title */
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.section-title h3{font-size:16px;font-weight:700}

/* Clock & reminder bell */
.topbar-right{display:flex;align-items:center;gap:14px}
.topbar-clock{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.topbar-clock .clock-icon{font-size:16px;animation:clockPulse 2s ease-in-out infinite}
@keyframes clockPulse{0%,100%{opacity:1}50%{opacity:.6}}
.btn-bell{position:relative;width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.btn-bell:hover{border-color:var(--blue);color:var(--blue)}
.btn-bell .bell-dot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--red);border:1.5px solid #fff;display:none}
.btn-bell .bell-dot.show{display:block;animation:bellPulse 1.2s ease-in-out infinite}
@keyframes bellPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.7}}

/* Slide-out notification panel */

// ==================== Auth ====================
const TOKEN_KEY="bs_token";
function getToken(){return localStorage.getItem(TOKEN_KEY)||"";}
function setToken(t){localStorage.setItem(TOKEN_KEY,t);}
function clearToken(){localStorage.removeItem(TOKEN_KEY);}

async function apiJSON(path,opts){
  const headers=Object.assign({"Content-Type":"application/json"},opts.headers||{});
  const tk=getToken();
  if(tk)headers["Authorization"]="Bearer "+tk;
  const res=await fetch(path,Object.assign({method:"GET"},opts,{headers}));
  let data={};
  try{data=await res.json();}catch(_){}
  if(!res.ok)throw new Error((data&&data.error)||("请求失败("+res.status+")"));
  return data;
}
const apiGet=p=>apiJSON(p,{method:"GET"});
const apiPost=(p,b)=>apiJSON(p,{method:"POST",body:JSON.stringify(b)});
const apiPut=(p,b)=>apiJSON(p,{method:"PUT",body:JSON.stringify(b)});
const apiDel=(p)=>apiJSON(p,{method:"DELETE"});

// ==================== Login ====================
async function tryLogin(){
  const u=document.getElementById("loginUser").value.trim();
  const p=document.getElementById("loginPwd").value;
  const errEl=document.getElementById("loginErr");
  const btn=document.getElementById("loginBtn");
  if(!u||!p){errEl.textContent="请填写账号和密码";return;}
  errEl.textContent="";btn.disabled=true;btn.textContent="登录中…";
  try{
    const res=await apiPost("/api/login",{username:u,password:p});
    if(!res.token)throw new Error("登录失败");
    setToken(res.token);
    STATE.user=res.user;
    await initApp();
  }catch(e){
    errEl.textContent=e.message||"登录失败";
  }finally{
    btn.disabled=false;btn.textContent="登 录";
  }
}

// ==================== Init App ====================
async function initApp(){
  try{
    const data=await apiGet("/api/dashboard");
    STATE.data=data;
    PRICES=data.prices||PRICES;
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("userName").textContent=STATE.user.name;
    document.getElementById("userRole").textContent=ROLE_LABELS[STATE.user.role]||STATE.user.role;
    document.getElementById("userAv").textContent=STATE.user.name.slice(0,1);
    document.getElementById("roleTag").textContent=ROLE_LABELS[STATE.user.role]||"";
    if(!CURRENT_PAGE)CURRENT_PAGE=DEFAULT_PAGE[STATE.user.role]||"branch_dashboard";
    render();
  }catch(e){
    clearToken();
    document.getElementById("login").style.display="flex";
    document.getElementById("app").style.display="none";
    toast(e.message,"err");
  }
}

function arrowBadge(arrow){
  if(!arrow)return '';
  const cls=arrow.dir==="up"?"up":(arrow.dir==="down"?"down":"flat");

  return '<span class="compare-badge '+cls+'">'+icon+arrow.pct+'%</span>';
}

function renderWorkflowBar(wf){

  const N=["①","②","③","④","⑤"];
  let html='<div class="wf-bar"><div class="wf-steps">';
  steps.forEach((s,i)=>{

  const maxRev=Math.max(...sorted.map(g=>g.monthRevenue||0),1);
  let html='<div class="section-title"><h3>🏢 分公司贡献排行</h3></div>';
  html+='<div style="background:#fff;border:0.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px">';
  sorted.forEach((g,i)=>{
    const pct=Math.round((g.monthRevenue/maxRev)*100);
    const medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1);
    html+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">'+
      '<div style="width:28px;text-align:center;font-size:16px;font-weight:600">'+medal+'</div>'+
      '<div style="flex:1">'+
        '<div style="display:flex;justify-content:space-between;margin-bottom:4px">'+
          '<span style="font-size:13px;font-weight:500">'+g.name+' <span style="color:var(--faint);font-size:11px">('+g.supervisor_name+')</span></span>'+
          '<span style="font-size:13px;font-weight:600;color:#7c5cff">¥'+fmt(g.monthRevenue)+'</span></div>'+
        '<div style="height:6px;background:#f5f5f7;border-radius:3px;overflow:hidden">'+
          '<div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#7c5cff,#0071e3);border-radius:3px"></div></div>'+
      '</div></div>';
  });
  html+='</div>';
  return html;
}

function drawMiniChart(containerId,points,color){
  const el=document.getElementById(containerId);
  if(!el)return;
  if(!points||points.length===0){el.innerHTML='<div style="color:var(--faint);font-size:12px;text-align:center;padding:40px 0">暂无数据</div>';return;}
  const w=el.offsetWidth||280,h=120,pad=8;
  const maxVal=Math.max(...points.map(p=>p.y),1);
  const stepX=(w-pad*2)/Math.max(points.length-1,1);
  const pts=points.map((p,i)=>({x:pad+i*stepX,y:h-pad-(p.y/maxVal)*(h-pad*2-10)}));
  let path="M "+pts[0].x+" "+pts[0].y;
  pts.forEach((p,i)=>{if(i>0)path+=" L "+p.x+" "+p.y;});
  let area=path+" L "+pts[pts.length-1].x+" "+(h-pad)+" L "+pts[0].x+" "+(h-pad)+" Z";
  const last=pts[pts.length-1];
  el.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'+
    '<path d="'+area+'" fill="'+color+'" opacity="0.08"/>'+
    '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="1.5"/>'+
    '<circle cx="'+last.x+'" cy="'+last.y+'" r="3" fill="'+color+'"/>'+
    '<text x="'+last.x+'" y="'+(last.y-6)+''+'" text-anchor="middle" font-size="10" fill="'+color+'" font-weight="600">'+Math.round(points[points.length-1].y)+'</text>'+
    '</svg>';
}

function renderDiseaseStats(ds){
  const vit=ds.vitiligo||0,pso=ds.psoriasis||0,der=ds.dermatitis||0;
  const total=vit+pso+der;
  let html='<div class="section-title"><h3>🏥 病种构成</h3>';
  html+='<button class="btn-sm" onclick="showDiseaseStatsModal()">编辑</button></div>';

  if(total===0){
    html+='<div style="width:100px;height:100px;border-radius:50%;border:10px solid #f0f0f0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:11px">暂无</div>';
  }else{
    const vPct=Math.round(vit/total*100),pPct=Math.round(pso/total*100),dPct=100-vPct-pPct;
    const R=40,C=2*Math.PI*R;
    html+='<svg width="100" height="100" viewBox="0 0 100 100" style="flex-shrink:0">'+
      '<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="#D4537E" stroke-width="12" stroke-dasharray="'+(C*vPct/100)+' '+C+'" transform="rotate(-90 50 50)"/>'+
      '<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="#7c3aed" stroke-width="12" stroke-dasharray="'+(C*pPct/100)+' '+C+'" stroke-dashoffset="'+(-C*vPct/100)+'" transform="rotate(-90 50 50)"/>'+
      '<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="#ED93B1" stroke-width="12" stroke-dasharray="'+(C*dPct/100)+' '+C+'" stroke-dashoffset="'+(-C*(vPct+pPct)/100)+'" transform="rotate(-90 50 50)"/>'+
      '<text x="50" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#333">'+total+'</text>'+
      '<text x="50" y="62" text-anchor="middle" font-size="9" fill="#999">总到院</text></svg>';
  }
  // 图例
  html+='<div style="flex:1">';
  const diseases=[
    {name:"白癜风",val:vit,color:"#D4537E"},
    {name:"银屑病",val:pso,color:"#7c3aed"},
    {name:"皮杂",val:der,color:"#ED93B1"},
  ];
  diseases.forEach(d=>{
    const pct=total>0?Math.round(d.val/total*100):0;
    html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'+
      '<div style="width:12px;height:12px;border-radius:3px;background:'+d.color+'"></div>'+

      '<span style="font-size:13px;font-weight:600;color:'+d.color+'">'+d.val+' ('+pct+'%)</span></div>';
  });
  html+='</div></div>';
  return html;
}

async function loadBossBranchTLS(gid){
  const el=document.getElementById("bossBranchTLS");
  if(!el)return;
  try{
    const res=await apiGet("/api/groups/"+gid+"/team-leaders");
    const tls=res.team_leaders||[];
    if(tls.length===0){
      el.innerHTML='<div class="empty"><div class="icon">👥</div><p>该组还没有组长</p></div>';
      return;
    }
    el.innerHTML='<div class="card-grid">'+tls.map(tl=>{
      const r=tl.today_record||{leads:0,arrive:0,orders:0};
      const rev=tl.revenue||0;
      let membersHtml='';
      if(tl.members&&tl.members.length>0){
        membersHtml='<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">'+
          '<div style="font-size:12px;color:var(--sub);margin-bottom:8px">组员 ('+tl.members.length+'人)</div>'+
          tl.members.map(m=>{
            const mr=m.today_record||{leads:0,arrive:0,orders:0};
            const mRev=(mr.arrive||0)*PRICES.arrive+(mr.orders||0)*PRICES.order;
            return '<div class="nested-member">'+
              '<span class="nm-name">'+m.name+'</span>'+
              '<span class="nm-stats">'+
              '<span>线索:'+(mr.leads||0)+'</span>'+
              '<span>到院:'+(mr.arrive||0)+'</span>'+
              '<span>开单:'+(mr.orders||0)+'</span>'+
              '<span style="color:#7c5cff;font-weight:600">'+fmt(mRev)+'元</span></span></div>';
          }).join("")+'</div>';
      }
      return '<div class="tl-card">'+
        '<div class="tl-top"><div><div class="tl-name">'+tl.name+'</div>'+
        '<div class="tl-sub">'+(tl.member_count>0?tl.member_count+'名组员':'无组员')+'</div></div>'+
        '<span class="tag '+(rev>0?'tag-green':'')+'">'+(rev>0?'有数据':'未录入')+'</span></div>'+
        '<div class="tl-stats">'+
        '<div class="tl-stat"><div class="sv num" style="color:#0071e3">'+(r.leads||0)+'</div><div class="sl">今日线索</div></div>'+
        '<div class="tl-stat"><div class="sv num" style="color:#ff9f0a">'+(r.arrive||0)+'</div><div class="sl">今日到院</div></div>'+
        '<div class="tl-stat"><div class="sv num" style="color:#34c759">'+(r.orders||0)+'</div><div class="sl">今日开单</div></div>'+
        '<div class="tl-stat"><div class="sv num" style="color:#7c5cff">'+fmt(rev)+'</div><div class="sl">今日收入</div></div>'+
        '</div>'+membersHtml+'</div>';
    }).join("")+'</div>';
  }catch(e){
    el.innerHTML='<div class="empty"><div class="icon">⚠️</div><p>'+e.message+'</p></div>';
  }
}

async function loadAuditCenter(){
  const el=document.getElementById("auditContent");
  if(!el)return;
  try{
    const params=new URLSearchParams();
    if(AUDIT_FILTER.date)params.set("date",AUDIT_FILTER.date);
    const records=await apiGet("/api/records?"+params.toString());

    // Filter by group if selected
    let filtered=records;
    if(AUDIT_FILTER.group&&AUDIT_FILTER.group!=="all"){
      filtered=records.filter(r=>r.group_name===((STATE.data.groups||[]).find(g=>g.id===AUDIT_FILTER.group)||{}).name);
    }

    if(filtered.length===0){
      el.innerHTML='<div class="empty"><div class="icon">📋</div><p>该日期暂无录入记录</p></div>';
      return;
    }

    // Summary stats
    let totalLeads=0,totalArrive=0,totalOrders=0,totalRevenue=0;
    filtered.forEach(r=>{
      totalLeads+=r.leads||0;
      totalArrive+=r.arrive||0;
      totalOrders+=r.orders||0;
      totalRevenue+=r.revenue||0;
    });

    let html='<div class="kpi-row" style="margin-bottom:16px">';
    html+='<div class="kpi"><div class="label"><span class="dot" style="background:#0071e3"></span>总线索</div><div class="val num">'+totalLeads+'</div></div>';
    html+='<div class="kpi"><div class="label"><span class="dot" style="background:#ff9f0a"></span>总到院</div><div class="val num">'+totalArrive+'</div></div>';
    html+='<div class="kpi"><div class="label"><span class="dot" style="background:#34c759"></span>总开单</div><div class="val num">'+totalOrders+'</div></div>';
    html+='<div class="kpi"><div class="label"><span class="dot" style="background:#7c5cff"></span>总收入</div><div class="val num">'+fmt(totalRevenue)+'<span class="u">元</span></div></div>';
    html+='</div>';

    html+='<div class="table-card"><div class="tc-head"><h3>录入记录 ('+filtered.length+'条)</h3></div>';
    html+='<table><thead><tr><th>姓名</th><th>角色</th><th>组</th><th>线索</th><th>到院</th><th>开单</th><th>收入</th><th>状态</th><th>操作</th></tr></thead><tbody>';
    const role=STATE.user.role;
    filtered.forEach(r=>{
      const stMap={draft:["待确认","#ff9f0a"],confirmed:["待审核","#7c5cff"],approved:["已通过","#34c759"],rejected:["已驳回","#ff3b30"]};
      const st=stMap[r.status]||["未知","#999"];
      let actions="";
      if(r.id){
        if((role==="team_leader"||role==="supervisor"||role==="boss")&&r.status==="draft"){
          actions='<button class="btn-sm" style="padding:2px 8px;font-size:11px;background:#34c759;color:#fff;border:none" onclick="confirmRecord(\''+r.id+'\')">确认</button>';
        }
        if((role==="supervisor"||role==="boss")&&(r.status==="draft"||r.status==="confirmed")){
          actions+=(actions?" ":"")+'<button class="btn-sm" style="padding:2px 8px;font-size:11px;background:#0071e3;color:#fff;border:none" onclick="approveRecord(\''+r.id+'\')">通过</button>';
          actions+=' <button class="btn-sm" style="padding:2px 8px;font-size:11px;background:#ff3b30;color:#fff;border:none" onclick="rejectRecord(\''+r.id+'\')">驳回</button>';
        }
      }
      html+='<tr>'+
        '<td><b>'+r.user_name+'</b></td>'+
        '<td><span class="tag '+ROLE_COLORS[r.user_role]+'">'+(ROLE_LABELS[r.user_role]||r.user_role)+'</span></td>'+
        '<td>'+(r.group_name||'-')+'</td>'+

function renderPriceSettings(){
  const p=PRICES;
  let html='<div class="page-title">收入单价设置</div>';
  html+='<div class="page-desc">设置到院和开单的单价 · 收入 = 到院数 × 到院单价 + 开单数 × 开单单价</div>';

  html+='<div class="field" style="margin-bottom:18px"><label style="font-size:13px;color:var(--sub);margin-bottom:8px;display:block">到院单价 (元/人)</label>';
  html+='<input type="number" id="pagePriceArrive" value="'+p.arrive+'" min="0" style="width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font-size:18px;font-weight:600;color:var(--blue)" /></div>';
  html+='<div class="field" style="margin-bottom:18px"><label style="font-size:13px;color:var(--sub);margin-bottom:8px;display:block">开单单价 (元/单)</label>';
  html+='<input type="number" id="pagePriceOrder" value="'+p.order+'" min="0" style="width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font-size:18px;font-weight:600;color:var(--purple)" /></div>';

  // Preview
  html+='<div style="background:var(--purple-bg);border-radius:12px;padding:16px;margin-bottom:16px">';
  html+='<div style="font-size:12px;color:var(--sub);margin-bottom:8px">收入计算示例</div>';
  html+='<div id="pricePreview" style="font-size:14px;line-height:1.8">到院 <b id="pvArrive">10</b> 人 × <b id="pvArrivePrice">'+p.arrive+'</b> 元 + 开单 <b id="pvOrders">5</b> 单 × <b id="pvOrderPrice">'+p.order+'</b> 元 = <b id="pvTotal" style="color:var(--purple);font-size:18px">'+fmt(10*p.arrive+5*p.order)+'元</b></div>';
  html+='</div>';

  html+='<button class="btn-sm btn-blue" onclick="savePricePage()" style="height:44px;padding:0 32px;font-size:15px">保存单价</button>';
  html+='<div class="err" id="pagePriceErr" style="margin-top:10px"></div>';
  html+='</div></div>';

  // Add event listeners after render
  setTimeout(()=>{
    const calc=()=>{
      const a=parseFloat(document.getElementById("pagePriceArrive").value)||0;
      const o=parseFloat(document.getElementById("pagePriceOrder").value)||0;
      const pa=document.getElementById("pvArrivePrice");
      const po=document.getElementById("pvOrderPrice");
      const pt=document.getElementById("pvTotal");
      if(pa)pa.textContent=a;
      if(po)po.textContent=o;
      if(pt)pt.textContent=fmt(10*a+5*o)+"元";
    };
    ["pagePriceArrive","pagePriceOrder"].forEach(id=>{
      const el=document.getElementById(id);
      if(el)el.addEventListener("input",calc);
    });
  },0);

  return html;
}

async function savePricePage(){
  const arrive=parseFloat(document.getElementById("pagePriceArrive").value)||0;
  const order=parseFloat(document.getElementById("pagePriceOrder").value)||0;
  const errEl=document.getElementById("pagePriceErr");
  if(arrive<0||order<0){errEl.textContent="单价不能为负数";return;}
  errEl.textContent="";
  try{
    await apiPut("/api/prices",{arrive,order});
    PRICES={arrive,order};
    toast("单价已保存");
    await refreshData();
  }catch(e){
    errEl.textContent=e.message;
  }
}

function renderEntryModal(detail){
  const u=detail.user;
  const group=detail.group;
  const today=detail.today_date;
  const todayRec=detail.today_record||{leads:0,arrive:0,orders:0,note:""};
  const prices=detail.prices;
  const recent=detail.recent_records||[];
  const ms=detail.month_stats||{leads:0,arrive:0,orders:0,revenue:0,days:0};

  const roleLabel=ROLE_LABELS[u.role]||"";
  const rev=(todayRec.arrive||0)*prices.arrive+(todayRec.orders||0)*prices.order;

  let body='<div class="modal-sub">'+u.name+' ('+roleLabel+')'+(group?' · '+group.name:'')+'</div>';

  body+='<div class="entry-stats">'+
    '<div class="entry-stat"><div class="es-v num" style="color:#0071e3">'+ms.leads+'</div><div class="es-l">本月线索</div></div>'+
    '<div class="entry-stat"><div class="es-v num" style="color:#ff9f0a">'+ms.arrive+'</div><div class="es-l">本月到院</div></div>'+
    '<div class="entry-stat"><div class="es-v num" style="color:#34c759">'+ms.orders+'</div><div class="es-l">本月开单</div></div>'+
    '<div class="entry-stat"><div class="es-v num" style="color:#7c5cff">'+fmt(ms.revenue)+'</div><div class="es-l">本月收入</div></div>'+
    '</div>';

  body+='<div class="field"><label>录入日期</label>'+
    '<input type="date" id="entry-date" value="'+today+'" max="'+today+'" /></div>';

  body+='<div class="field-row">'+
    '<div class="field"><label>线索数</label><input type="number" id="entry-leads" value="'+(todayRec.leads||0)+'" placeholder="0" min="0" /></div>'+
    '<div class="field"><label>到院数</label><input type="number" id="entry-arrive" value="'+(todayRec.arrive||0)+'" placeholder="0" min="0" /></div>'+
    '<div class="field"><label>开单数</label><input type="number" id="entry-orders" value="'+(todayRec.orders||0)+'" placeholder="0" min="0" /></div>'+
    '</div>';

  body+='<div class="entry-revenue">'+
    '<div class="er-l">预计收入（到院×'+prices.arrive+' + 开单×'+prices.order+'）</div>'+
    '<div class="er-v num" id="entry-rev">'+fmt(rev)+'元</div></div>';

  body+='<div class="field"><label>备注（选填）</label><input id="entry-note" value="'+(todayRec.note||'')+'" placeholder="备注信息" /></div>';
  body+='<div class="err" id="entry-err"></div>';
  body+='<div class="btns">'+
    '<button class="btn-cancel" onclick="closeModal()">取消</button>'+
    '<button class="btn-confirm" id="entry-save" onclick="saveEntryData(\''+u.id+'\')">保存数据</button></div>';

  if(recent.length>0){
    body+='<div class="entry-history"><h4>近期记录</h4><table><thead><tr><th>日期</th><th>线索</th><th>到院</th><th>开单</th><th>收入</th></tr></thead><tbody>';
    recent.slice(0,7).forEach(r=>{
      const rRev=(r.arrive||0)*prices.arrive+(r.orders||0)*prices.order;
      body+='<tr><td>'+r.date+'</td><td class="num">'+(r.leads||0)+'</td><td class="num">'+(r.arrive||0)+'</td><td class="num">'+(r.orders||0)+'</td><td class="num">'+fmt(rRev)+'元</td></tr>';
    });
    body+='</tbody></table></div>';
  }

  openModal({title:"录入数据",body,extraClass:"entry-modal"});

let TREND_STATE={metric:"leads",month:null,data:null};

const METRIC_INFO={
  leads:{label:"线索",color:"#0071e3",unit:""},
  arrive:{label:"到院",color:"#ff9f0a",unit:""},
  orders:{label:"开单",color:"#34c759",unit:""},

async function fetchTrendData(){
  const today=todayStr();
  const month=TREND_STATE.month||today.slice(0,7);
  const url="/api/trends?month="+month;
  TREND_STATE.data=await apiGet(url);
  TREND_STATE.month=TREND_STATE.data.month;
}

function renderTrendModal(){
  const d=TREND_STATE.data;
  const metric=TREND_STATE.metric;
  const info=METRIC_INFO[metric];
  const mt=d.month_total;
  const pmt=d.prev_month_total;
  const tr=d.trends[metric];
  const wm=d.within_month[metric];

  const [yr,mn]=d.month.split("-");
  const monthLabel=yr+"年"+parseInt(mn)+"月";

  const badgeCls=tr.pct>0?"up":(tr.pct<0?"down":"flat");
  const badgeIcon=tr.pct>0?"↑":(tr.pct<0?"↓":"→");
  const trendBadge='<span class="trend-badge '+badgeCls+'">'+badgeIcon+' '+Math.abs(tr.pct)+'% vs上月</span>';

  const wmBadgeCls=wm.pct>0?"up":(wm.pct<0?"down":"flat");
  const wmIcon=wm.pct>0?"↑":(wm.pct<0?"↓":"→");
  const wmBadge='<span class="trend-badge '+wmBadgeCls+'">月内 '+wmIcon+' '+Math.abs(wm.pct)+'%</span>';

  let body='<div class="modal-sub">点击下方标签切换指标 · 点击箭头切换月份</div>';

  body+='<div class="trend-tabs">';
  Object.keys(METRIC_INFO).forEach(k=>{
    const active=k===metric?"active":"";
    body+='<button class="trend-tab '+active+'" onclick="switchTrendMetric(\''+k+'\')">'+METRIC_INFO[k].label+'</button>';
  });
  body+='</div>';

  body+='<div class="trend-month-bar">'+
    '<div class="mb-nav">'+
    '<button class="mb-btn" onclick="switchTrendMonth(-1)">◀</button>'+
    '<span class="mb-label">'+monthLabel+'</span>'+
    '<button class="mb-btn" onclick="switchTrendMonth(1)">▶</button>'+
    '</div>'+
    '<div style="display:flex;gap:8px">'+trendBadge+wmBadge+'</div></div>';

  body+='<div class="trend-chart-box">'+drawTrendChart(d.daily,metric,info.color)+'</div>';

  body+='<div class="trend-summary">';
  body+='<div class="trend-sum-card">'+
    '<div class="tsc-label">本月汇总（'+mt.days+'天有数据）</div>';
  Object.keys(METRIC_INFO).forEach(k=>{
    const highlight=k===metric?'style="color:'+METRIC_INFO[k].color+'"':"";
    body+='<div class="tsc-row" '+highlight+'><span>'+METRIC_INFO[k].label+'</span><span class="num">'+fmt(mt[k])+METRIC_INFO[k].unit+'</span></div>';
  });
  body+='</div>';
  body+='<div class="trend-sum-card">'+
    '<div class="tsc-label">上月汇总（'+pmt.days+'天有数据）</div>';
  Object.keys(METRIC_INFO).forEach(k=>{
    const highlight=k===metric?'style="color:'+METRIC_INFO[k].color+'"':"";
    body+='<div class="tsc-row" '+highlight+'><span>'+METRIC_INFO[k].label+'</span><span class="num">'+fmt(pmt[k])+METRIC_INFO[k].unit+'</span></div>';
  });
  body+='</div></div>';

  openModal({title:"📈 趋势分析",body,extraClass:"trend-modal"});
}

function drawTrendChart(daily,metric,color){
  const w=620,h=240,pad={top:20,right:20,bottom:35,left:50};
  const cw=w-pad.left-pad.right;
  const ch=h-pad.top-pad.bottom;

  const values=daily.map(d=>d[metric]);
  const maxVal=Math.max(...values,1);

  const xScale=i=>pad.left+(i/Math.max(daily.length-1,1))*cw;
  const yScale=v=>pad.top+ch-(v/maxVal)*ch;

  let linePath="",areaPath="";
  daily.forEach((d,i)=>{
    const x=xScale(i),y=yScale(d[metric]);
    if(i===0){linePath+="M "+x+" "+y;areaPath+="M "+x+" "+(pad.top+ch)+" L "+x+" "+y;}
    else{linePath+=" L "+x+" "+y;areaPath+=" L "+x+" "+y;}
  });
  areaPath+=" L "+xScale(daily.length-1)+" "+(pad.top+ch)+" Z";

  let grid="";
  for(let i=0;i<=4;i++){
    const y=pad.top+(ch/4)*i;
    const val=Math.round(maxVal-(maxVal/4)*i);
    grid+='<line x1="'+pad.left+'" y1="'+y+'" x2="'+(pad.left+cw)+'" y2="'+y+'" stroke="#e6e8f0" stroke-width="1" stroke-dasharray="3,3"/>';
    grid+='<text x="'+(pad.left-8)+'" y="'+(y+4)+'" font-size="10" fill="#86868b" text-anchor="end">'+fmt(val)+'</text>';
  }

  let xLabels="";
  const step=Math.ceil(daily.length/10);
  daily.forEach((d,i)=>{
    if(i%step===0||i===daily.length-1){
      const x=xScale(i);
      xLabels+='<text x="'+x+'" y="'+(pad.top+ch+18)+'" font-size="10" fill="#86868b" text-anchor="middle">'+d.day+'</text>';
    }
  });

  let points="";
  daily.forEach((d,i)=>{
    const x=xScale(i),y=yScale(d[metric]);
    if(d[metric]>0){
      points+='<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="'+color+'" opacity="0.85"/>';
      points+='<title>'+d.date+': '+fmt(d[metric])+METRIC_INFO[metric].unit+'</title>';
    }
  });

  const lastActive=daily.slice().reverse().find(d=>d[metric]>0);
  if(lastActive){
    const li=daily.indexOf(lastActive);
    const lx=xScale(li),ly=yScale(lastActive[metric]);
    points+='<circle cx="'+lx+'" cy="'+ly+'" r="6" fill="'+color+'" opacity="0.2"/>';
    points+='<circle cx="'+lx+'" cy="'+ly+'" r="4" fill="'+color+'"/>';
    points+='<text x="'+lx+'" y="'+(ly-12)+'" font-size="11" font-weight="600" fill="'+color+'" text-anchor="middle">'+fmt(lastActive[metric])+METRIC_INFO[metric].unit+'</text>';
  }

  const activeVals=values.filter(v=>v>0);
  if(activeVals.length>1){
    const avg=activeVals.reduce((s,v)=>s+v,0)/activeVals.length;
    const ay=yScale(avg);
    grid+='<line x1="'+pad.left+'" y1="'+ay+'" x2="'+(pad.left+cw)+'" y2="'+ay+'" stroke="'+color+'" stroke-width="1" stroke-dasharray="5,5" opacity="0.4"/>';
    grid+='<text x="'+(pad.left+cw-4)+'" y="'+(ay-4)+'" font-size="9" fill="'+color+'" text-anchor="end" opacity="0.7">日均 '+fmt(avg)+'</text>';
  }

  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto">'+
    '<defs><linearGradient id="grad-'+metric+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+color+'" stop-opacity="0.2"/>'+
    '<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    grid+xLabels+
    '<path d="'+areaPath+'" fill="url(#grad-'+metric+')"/>'+
    '<path d="'+linePath+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    points+'</svg>';
}

async function switchTrendMetric(metric){
  TREND_STATE.metric=metric;
  renderTrendModal();
}

async function switchTrendMonth(dir){
  const [yr,mn]=TREND_STATE.month.split("-").map(Number);
  let newY,newM;
  if(dir>0){newM=mn+1;if(newM>12){newM=1;newY=yr+1;}else newY=yr;}
  else{newM=mn-1;if(newM<1){newM=12;newY=yr-1;}else newY=yr;}
  TREND_STATE.month=newY+"-"+String(newM).padStart(2,"0");
  openModal({title:"趋势分析",body:'<div style="text-align:center;padding:40px 0;color:var(--faint)"><div style="font-size:28px;margin-bottom:8px">⏳</div>加载趋势数据...</div>',extraClass:"trend-modal"});
  try{
    await fetchTrendData();
    renderTrendModal();
  }catch(e){
    toast(e.message,"err");
    renderTrendModal();
  }
}

// ==================== Modals ====================
let MODAL_ESC_HANDLER=null;
let MODAL_DOC_INIT=false;
let MODAL_DRAGGING=false;
let MODAL_DRAG_START={x:0,y:0,px:0,py:0};

function openModal(opts){
  const title=(opts&&opts.title)||"操作";
  const body=(opts&&opts.body)||"";
  const extraClass=(opts&&opts.extraClass)||"";
  document.getElementById("modalRoot").innerHTML=
    '<div class="modal-overlay show" id="modalOverlay" onclick="if(event.target===this)closeModal()">'+
    '<div class="modal '+extraClass+'" id="activeModal">'+
    '<div class="modal-header" id="activeModalHeader">'+
    '<h3>'+title+'</h3>'+
    '<div style="display:flex;align-items:center;gap:8px">'+
    '<span class="drag-hint">⠿ 拖动</span>'+
    '<button class="modal-x" onclick="closeModal()" title="关闭">✕</button>'+
    '</div></div>'+
    '<div class="modal-body">'+body+'</div>'+
    '</div></div>';
  // Init drag
  const header=document.getElementById("activeModalHeader");
  if(header){
    header.onmousedown=onModalDragStart;
    header.ontouchstart=onModalDragStart;
  }
  if(!MODAL_DOC_INIT){
    MODAL_DOC_INIT=true;
    document.addEventListener("mousemove",onModalDragMove);
    document.addEventListener("touchmove",onModalDragMove,{passive:false});
    document.addEventListener("mouseup",onModalDragEnd);
    document.addEventListener("touchend",onModalDragEnd);
  }
  // ESC to close
  MODAL_ESC_HANDLER=(e)=>{if(e.key==="Escape")closeModal();};
  document.addEventListener("keydown",MODAL_ESC_HANDLER);
}

function closeModal(){
  const overlay=document.getElementById("modalOverlay");
  if(overlay){
    overlay.classList.remove("show");
    const modal=document.getElementById("activeModal");
    // Keep "dragging" class during close animation so modal stays at dragged position
    // Reset position after animation completes (like notif panel)
    setTimeout(()=>{
      if(modal){
        modal.classList.remove("dragging");
        modal.style.removeProperty("--drag-x");
        modal.style.removeProperty("--drag-y");
      }
      document.getElementById("modalRoot").innerHTML="";
    },360);
  }else{
    document.getElementById("modalRoot").innerHTML="";
  }
  if(MODAL_ESC_HANDLER){
    document.removeEventListener("keydown",MODAL_ESC_HANDLER);
    MODAL_ESC_HANDLER=null;
  }
}

function onModalDragStart(e){
  if(e.target.closest(".modal-x"))return;
  MODAL_DRAGGING=true;
  const pt=e.touches?e.touches[0]:e;
  const modal=document.getElementById("activeModal");
  if(!modal)return;
  const rect=modal.getBoundingClientRect();
  MODAL_DRAG_START={x:pt.clientX,y:pt.clientY,px:rect.left,py:rect.top};
  modal.style.setProperty("--drag-x",rect.left+"px");
  modal.style.setProperty("--drag-y",rect.top+"px");
  modal.classList.add("dragging");
  if(e.preventDefault)e.preventDefault();
}

function onModalDragMove(e){
  if(!MODAL_DRAGGING)return;
  const pt=e.touches?e.touches[0]:e;
  const modal=document.getElementById("activeModal");
  if(!modal)return;
  let nx=MODAL_DRAG_START.px+(pt.clientX-MODAL_DRAG_START.x);
  let ny=MODAL_DRAG_START.py+(pt.clientY-MODAL_DRAG_START.y);
  const w=modal.offsetWidth,h=modal.offsetHeight;
  nx=Math.max(4,Math.min(window.innerWidth-w-4,nx));
  ny=Math.max(4,Math.min(window.innerHeight-h-4,ny));
  modal.style.setProperty("--drag-x",nx+"px");
  modal.style.setProperty("--drag-y",ny+"px");
  if(e.preventDefault)e.preventDefault();
}

function onModalDragEnd(){
  MODAL_DRAGGING=false;
}

// Backward compatible wrapper - auto extract .modal-title or h3
function showModal(innerHtml){
  let title="操作";
  let body=innerHtml;
  // Try to extract .modal-title
  const m1=innerHtml.match(/^<div class="modal-title">([\s\S]*?)<\/div>/);
  if(m1){
    title=m1[1];
    body=innerHtml.slice(m1[0].length);
  }else{
    // Try to extract <h3>...</h3>
    const m2=innerHtml.match(/^<h3[^>]*>([\s\S]*?)<\/h3>/);
    if(m2){
      title=m2[1].replace(/<[^>]+>/g,"").trim();
      body=innerHtml.slice(m2[0].length);
    }
  }
  openModal({title,body});
}

    '<div class="field"><label>新密码 (至少6位)</label><input id="newPwd" type="password" /></div>'+
    '<div class="err" id="pwd-err"></div>'+
    '<div class="btns"><button class="btn-cancel" onclick="closeModal()">取消</button>'+
    '<button class="btn-confirm" onclick="doChangePwd()">确认修改</button></div>'
  });
}

async function doChangePwd(){
  const oldPwd=document.getElementById("oldPwd").value;
  const newPwd=document.getElementById("newPwd").value;
  const errEl=document.getElementById("pwd-err");
  if(!oldPwd||!newPwd){errEl.textContent="请填写旧密码和新密码";return;}
  if(newPwd.length<6){errEl.textContent="新密码至少6位";return;}
  errEl.textContent="";
  try{
    await apiPost("/api/change_pwd",{oldPwd,newPwd});
    toast("密码修改成功");
    closeModal();
  }catch(e){
    errEl.textContent=e.message;
  }
}

// ==================== Clock & Notification ====================
const REMINDER_KEY="bs_reminder";
let NOTIF_DATA=null;
let NOTIF_LOADING=false;

function loadReminder(){
  try{return JSON.parse(localStorage.getItem(REMINDER_KEY))||{enabled:false,time:"09:00",lastTriggered:""};}catch(e){return{enabled:false,time:"09:00",lastTriggered:""};}
}
function saveReminder(r){
  localStorage.setItem(REMINDER_KEY,JSON.stringify(r));
}

function startClock(){
  const el=document.getElementById("clockTime");
  if(!el)return;
  function tick(){
    const d=new Date();
    const p=n=>String(n).padStart(2,"0");
    el.textContent=p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
  }
  tick();
  setInterval(tick,1000);
}

function toggleNotifPanel(){
  const panel=document.getElementById("notifPanel");
  const overlay=document.getElementById("notifOverlay");
  const isOpen=panel.classList.contains("show");
  if(isOpen){
    closeNotifPanel();
  }else{
    panel.classList.add("show");
    overlay.classList.add("show");
    document.getElementById("bellDot").classList.remove("show");
    if(!NOTIF_DATA&&!NOTIF_LOADING){
      fetchAndShowNotif();
    }
  }
}

function closeNotifPanel(){
  const panel=document.getElementById("notifPanel");
  const overlay=document.getElementById("notifOverlay");
  panel.classList.remove("show");
  overlay.classList.remove("show");
  // Reset drag position after close animation
  setTimeout(()=>{
    panel.classList.remove("dragging");
    panel.style.removeProperty("--drag-x");
    panel.style.removeProperty("--drag-y");
    DRAG_OFFSET={x:0,y:0};
  },420);
}

// ==================== Panel Drag ====================
let DRAG_OFFSET={x:0,y:0};
let DRAGGING=false;
let DRAG_START={x:0,y:0,px:0,py:0};
let DRAG_DOC_INIT=false;

function initPanelDrag(){
  const panel=document.getElementById("notifPanel");
  const header=panel.querySelector(".notif-header");
  if(!header)return;

  // Attach header listener (header gets replaced on re-render)
  header.onmousedown=onDragStart;
  header.ontouchstart=onDragStart;

  // Document listeners only once
  if(DRAG_DOC_INIT)return;
  DRAG_DOC_INIT=true;
  document.addEventListener("mousemove",onDragMove);
  document.addEventListener("touchmove",onDragMove,{passive:false});
  document.addEventListener("mouseup",onDragEnd);
  document.addEventListener("touchend",onDragEnd);
}

function onDragStart(e){
  if(e.target.closest(".notif-close"))return;
  DRAGGING=true;
  const pt=e.touches?e.touches[0]:e;
  const panel=document.getElementById("notifPanel");
  const rect=panel.getBoundingClientRect();
  DRAG_START={x:pt.clientX,y:pt.clientY,px:rect.left,py:rect.top};
  // Set position vars BEFORE adding dragging class to prevent jump
  panel.style.setProperty("--drag-x",rect.left+"px");
  panel.style.setProperty("--drag-y",rect.top+"px");
  panel.classList.add("dragging");
  if(e.preventDefault)e.preventDefault();
}

function onDragMove(e){
  if(!DRAGGING)return;
  const pt=e.touches?e.touches[0]:e;
  const panel=document.getElementById("notifPanel");
  let nx=DRAG_START.px+(pt.clientX-DRAG_START.x);
  let ny=DRAG_START.py+(pt.clientY-DRAG_START.y);
  nx=Math.max(4,Math.min(window.innerWidth-panel.offsetWidth-4,nx));
  ny=Math.max(4,Math.min(window.innerHeight-60,ny));
  panel.style.setProperty("--drag-x",nx+"px");
  panel.style.setProperty("--drag-y",ny+"px");
  if(e.preventDefault)e.preventDefault();
}

function onDragEnd(){
  DRAGGING=false;
}

async function fetchAndShowNotif(){
  NOTIF_LOADING=true;
  renderNotifLoading();
  try{
    NOTIF_DATA=await apiGet("/api/yesterday-summary");
    renderNotifPanel(NOTIF_DATA);
  }catch(e){
    renderNotifError(e.message);
  }finally{
    NOTIF_LOADING=false;
  }
}

function renderNotifLoading(){
  const panel=document.getElementById("notifPanel");
  panel.innerHTML='<div class="notif-header"><h3>📊 昨日数据回顾</h3><div style="display:flex;align-items:center;gap:10px"><span class="drag-hint">⠿ 拖动</span><button class="notif-close" onclick="closeNotifPanel()">✕</button></div></div><div class="notif-body"><div style="text-align:center;padding:40px 0;color:var(--faint)"><div style="font-size:28px;margin-bottom:8px">⏳</div>加载昨日数据...</div></div>';
  initPanelDrag();
}

function renderNotifError(msg){
  const panel=document.getElementById("notifPanel");
  panel.innerHTML='<div class="notif-header"><h3>📊 昨日数据回顾</h3><div style="display:flex;align-items:center;gap:10px"><span class="drag-hint">⠿ 拖动</span><button class="notif-close" onclick="closeNotifPanel()">✕</button></div></div><div class="notif-body"><div class="notif-empty"><div class="icon">⚠️</div><p>'+msg+'</p></div>'+renderSettingsSection()+'</div>';
  initPanelDrag();
}

function fmtArrow(arrow){
  if(!arrow)return'';
  const cls=arrow.dir==="up"?"up":(arrow.dir==="down"?"down":"flat");
  const icon=arrow.dir==="up"?"↑":(arrow.dir==="down"?"↓":"→");
  return'<span class="ngi-arrow '+cls+'">'+icon+' '+arrow.pct+'%</span>';
}

function renderNotifPanel(data){
  const panel=document.getElementById("notifPanel");
  const r=data;

  // Format date
  const[yr,mn,dy]=r.yesterday_date.split("-");
  const dateLabel=parseInt(mn)+"月"+parseInt(dy)+"日 ("+["周日","周一","周二","周三","周四","周五","周六"][new Date(r.yesterday_date).getDay()]+")";

  // Total stats
  const t=r.total;
  const ta=r.total_arrows;
  const badgeHTML=(a)=>{
    if(!a)return'';
    const cls=a.dir==="up"?"up":(a.dir==="down"?"down":"flat");
    const icon=a.dir==="up"?"↑":(a.dir==="down"?"↓":"→");
    return'<div class="nt-badge '+cls+'">'+icon+a.pct+'%</div>';
  };

  let html='<div class="notif-header">'+
    '<h3>📊 昨日数据回顾</h3>'+
    '<div style="display:flex;align-items:center;gap:10px">'+
    '<span class="drag-hint">⠿ 拖动</span>'+
    '<button class="notif-close" onclick="closeNotifPanel()">✕</button>'+
    '</div></div>';

  html+='<div class="notif-body">';
  html+='<div class="notif-date">📅 '+dateLabel+' 数据汇总</div>';

  // Total overview
  html+='<div class="notif-total">'+
    '<div class="nt-title">📈 全公司昨日总计 <span style="font-size:11px;color:var(--faint)">vs 前日</span></div>'+
    '<div class="nt-grid">'+
    '<div class="nt-item"><div class="nt-val num" style="color:#0071e3">'+t.leads+'</div><div class="nt-lab">线索</div>'+badgeHTML(ta.leads)+'</div>'+
    '<div class="nt-item"><div class="nt-val num" style="color:#ff9f0a">'+t.arrive+'</div><div class="nt-lab">到院</div>'+badgeHTML(ta.arrive)+'</div>'+
    '<div class="nt-item"><div class="nt-val num" style="color:#34c759">'+t.orders+'</div><div class="nt-lab">开单</div>'+badgeHTML(ta.orders)+'</div>'+
    '<div class="nt-item"><div class="nt-val num" style="color:#7c5cff">'+fmt(t.revenue)+'</div><div class="nt-lab">收入(元)</div>'+badgeHTML(ta.revenue)+'</div>'+
    '</div></div>';

  // Highlight: top gainer & top loser
  if(r.top_gainer||r.top_loser){
    html+='<div class="notif-highlight">';
    if(r.top_gainer){
      const g=r.top_gainer;
      html+='<div class="notif-hl-card gain">'+
        '<div class="hl-title">📈 数据增长最佳</div>'+
        '<div class="hl-name">'+g.name+'</div>'+
        '<div class="hl-detail">收入 '+fmt(g.yesterday.revenue)+'元 <b style="color:var(--green)">↑'+g.arrows.revenue.pct+'%</b></div>'+
        '</div>';
    }else{
      html+='<div class="notif-hl-card" style="background:var(--bg)"><div class="hl-title" style="color:var(--faint)">📈 暂无增长组</div></div>';
    }
    if(r.top_loser){
      const l=r.top_loser;
      html+='<div class="notif-hl-card lose">'+
        '<div class="hl-title">📉 数据下降最多</div>'+
        '<div class="hl-name">'+l.name+'</div>'+
        '<div class="hl-detail">收入 '+fmt(l.yesterday.revenue)+'元 <b style="color:var(--red)">↓'+l.arrows.revenue.pct+'%</b></div>'+
        '</div>';
    }else{
      html+='<div class="notif-hl-card" style="background:var(--bg)"><div class="hl-title" style="color:var(--faint)">📉 暂无下降组</div></div>';
    }
    html+='</div>';
  }

  // Group list
  if(r.groups&&r.groups.length>0){
    html+='<div class="notif-groups">';
    html+='<div class="ng-title">🏢 各组昨日收入对比</div>';
    r.groups.forEach(g=>{
      const rev=g.yesterday.revenue;
      const arrow=g.arrows.revenue;
      const arrowHTML=arrow.dir==="up"?'<span class="ngi-arrow up">↑ '+arrow.pct+'%</span>':
        arrow.dir==="down"?'<span class="ngi-arrow down">↓ '+arrow.pct+'%</span>':
        '<span class="ngi-arrow flat">→ 0%</span>';
      html+='<div class="notif-group-item">'+
        '<div class="ngi-left">'+
        '<div class="ngi-icon">'+g.name.slice(0,1)+'</div>'+
        '<div class="ngi-info"><div class="ngi-name">'+g.name+'</div>'+
        '<div class="ngi-sub">线索'+g.yesterday.leads+' · 到院'+g.yesterday.arrive+' · 开单'+g.yesterday.orders+'</div></div></div>'+
        '<div class="ngi-right">'+
        '<span class="ngi-revenue">'+fmt(rev)+'元</span>'+
        arrowHTML+'</div></div>';
    });
    html+='</div>';
  }else{
    html+='<div class="notif-empty"><div class="icon">📋</div><p>暂无组数据</p></div>';
  }

  html+='</div>';

  // Settings section
  html+=renderSettingsSection();

  panel.innerHTML=html;
  initPanelDrag();
}

function renderSettingsSection(){
  const r=loadReminder();
  const toggleCls=r.enabled?"on":"";
  return'<div class="notif-settings">'+
    '<div class="ns-row">'+
    '<div class="ns-label">⏰ 定时数据提醒</div>'+
    '<div class="ns-toggle '+toggleCls+'" id="reminderToggle" onclick="toggleReminder()"></div></div>'+
    '<div class="ns-desc">开启后，每天到达设定时间会自动弹出昨日数据回顾，包括各组涨跌情况</div>'+
    '<div class="ns-time-row">'+
    '<span style="font-size:13px;color:var(--sub)">每天提醒时间：</span>'+
    '<input type="time" id="reminderTime" value="'+r.time+'" onchange="updateReminderTime()" '+(r.enabled?'':'disabled')+' />'+
    '<button class="ns-btn" onclick="testReminder()">立即预览</button>'+
    '</div></div>';
}

function toggleReminder(){
  const r=loadReminder();
  r.enabled=!r.enabled;
  saveReminder(r);
  const toggle=document.getElementById("reminderToggle");
  if(toggle)toggle.classList.toggle("on",r.enabled);
  const timeInput=document.getElementById("reminderTime");
  if(timeInput)timeInput.disabled=!r.enabled;
  toast(r.enabled?"已开启定时提醒":"已关闭定时提醒");
}

function updateReminderTime(){
  const input=document.getElementById("reminderTime");
  if(!input)return;
  const r=loadReminder();
  r.time=input.value;
  r.lastTriggered=""; // reset so it can trigger today if time hasn't passed
  saveReminder(r);
  toast("提醒时间已更新为 "+input.value);
}

function testReminder(){
  fetchAndShowNotif();
}

function checkReminder(){
  const r=loadReminder();
  if(!r.enabled)return;
  const now=new Date();
  const p=n=>String(n).padStart(2,"0");
  const nowStr=p(now.getHours())+":"+p(now.getMinutes());
  const today=now.getFullYear()+"-"+p(now.getMonth()+1)+"-"+p(now.getDate());
  if(nowStr===r.time&&r.lastTriggered!==today){
    r.lastTriggered=today;
    saveReminder(r);
    // Auto show notification
    document.getElementById("notifPanel").classList.add("show");
    document.getElementById("notifOverlay").classList.add("show");
    document.getElementById("bellDot").classList.add("show");
    fetchAndShowNotif();
  }
}
