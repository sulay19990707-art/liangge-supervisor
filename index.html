<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>益彩晶流量号组</title>
<style>
:root{
  --bg:#f0f3f8;--bg2:#e8ecf3;--card:#fff;--card-glass:rgba(255,255,255,.7);
  --ink:#0f172a;--ink2:#1e293b;--sub:#64748b;--faint:#94a3b8;--line:#e2e8f0;
  --accent:#0891b2;--accent2:#06b6d4;--accent-bg:#ecfeff;
  --green:#059669;--green-bg:#ecfdf5;
  --red:#dc2626;--red-bg:#fef2f2;
  --yellow:#d97706;--yellow-bg:#fffbeb;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
  --btn1:#FF3300;--btn2:#EE7926;--btn-glow:rgba(255,80,20,.5);
  --bar1:#ccf;--bar2:#e7d04c;--bar3:#31fb78;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 20px rgba(0,0,0,.06);
  --shadow-lg:0 4px 6px rgba(0,0,0,.05),0 16px 48px rgba(0,0,0,.1);
  --radius:18px;--radius-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Inter","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}

/* ===== 高级渐变条（顶部） ===== */
.grad-bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:999;
  background:linear-gradient(90deg,var(--bar1),var(--bar2),var(--bar3));
  background-size:200% 100%;animation:barFlow 6s linear infinite}
@keyframes barFlow{0%{background-position:0% 0}100%{background-position:200% 0}}

/* ===== 浮动光晕 ===== */
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.35;z-index:-1;pointer-events:none}
.orb-1{width:360px;height:360px;background:rgba(99,102,241,.18);top:8%;left:-80px;animation:orbFloat1 18s ease-in-out infinite}
.orb-2{width:320px;height:320px;background:rgba(255,51,0,.10);bottom:5%;right:-60px;animation:orbFloat2 22s ease-in-out infinite}
.orb-3{width:280px;height:280px;background:rgba(49,251,120,.08);top:55%;left:45%;animation:orbFloat1 26s ease-in-out infinite reverse}
@keyframes orbFloat1{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,30px)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0)}50%{transform:translate(-45px,-35px)}}

/* ===== 渐变发光按钮 ===== */
.btn-glow{position:relative;border:none !important;color:#fff;font-weight:600;cursor:pointer;
  background:linear-gradient(135deg,var(--btn1),var(--btn2));
  box-shadow:0 6px 24px var(--btn-glow),inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .2s,box-shadow .2s}
.btn-glow:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(255,80,20,.65),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-glow::after{content:"";position:absolute;inset:-1px;border-radius:inherit;
  background:linear-gradient(135deg,var(--btn1),var(--btn2));filter:blur(16px);opacity:.4;z-index:-1;transition:opacity .2s}
.btn-glow:hover::after{opacity:.7}

/* ===== 渐变文字 ===== */
.grad-text{background:linear-gradient(92deg,var(--bar1),var(--bar2),var(--bar3));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  background-size:200% auto;animation:shimmer 5s linear infinite}
@keyframes shimmer{0%{background-position:0% center}100%{background-position:200% center}}

/* ===== 页面入场动画 ===== */
.page-in{animation:pageFadeUp .5s cubic-bezier(.22,.61,.36,1) both}
@keyframes pageFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.stagger>*{animation:pageFadeUp .5s cubic-bezier(.22,.61,.36,1) both}
.stagger>*:nth-child(1){animation-delay:.03s}.stagger>*:nth-child(2){animation-delay:.07s}
.stagger>*:nth-child(3){animation-delay:.11s}.stagger>*:nth-child(4){animation-delay:.15s}
.stagger>*:nth-child(5){animation-delay:.19s}.stagger>*:nth-child(6){animation-delay:.23s}

/* ===== 胶囊徽章 ===== */
.pill-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 16px;border-radius:999px;
  background:var(--card-glass);border:1px solid var(--line);backdrop-filter:blur(12px);
  font-size:12.5px;color:var(--sub);box-shadow:var(--shadow)}
.pill-badge .pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--bar3);box-shadow:0 0 8px var(--bar3);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ===== 叠加头像 ===== */
.avatar-stack{display:flex}
.avatar-stack .av-mini{width:32px;height:32px;border-radius:50%;margin-left:-10px;border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.15)}
.avatar-stack .av-mini:first-child{margin-left:0}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:radial-gradient(900px 600px at 10% 5%,rgba(8,145,178,.08),transparent 55%),
  radial-gradient(800px 700px at 85% 15%,rgba(6,182,212,.06),transparent 55%),
  radial-gradient(700px 600px at 40% 90%,rgba(8,145,178,.04),transparent 55%);
  background-size:180% 180%;animation:flowbg 25s ease-in-out infinite}
body::after{content:"";position:fixed;inset:0;z-index:-1;background-image:radial-gradient(rgba(0,0,0,.025) 1px,transparent 1px);background-size:30px 30px;opacity:.5;pointer-events:none}
@keyframes flowbg{0%{background-position:0% 0%}33%{background-position:60% 40%}66%{background-position:100% 100%}100%{background-position:0% 0%}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* Login */
.login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 80% 50% at 50% -10%,#164e63 0%,transparent 60%),
  radial-gradient(ellipse 60% 60% at 80% 100%,#0e7490 0%,transparent 50%),
  linear-gradient(160deg,#042f2e 0%,#134e4a 40%,#042f2e 100%)}
.login::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.02) 1px,transparent 1px);background-size:36px 36px}
.login-card{position:relative;z-index:1;width:420px;max-width:92vw;background:rgba(255,255,255,.92);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,.3);border-radius:24px;padding:40px 34px 32px;box-shadow:0 32px 80px rgba(0,0,0,.5),0 8px 32px rgba(0,0,0,.3);text-align:center;animation:scaleIn .5s cubic-bezier(.22,.61,.36,1)}
.login-logo{width:64px;height:64px;margin:0 auto 14px;background:url('logo.png') center/contain no-repeat;display:block;filter:drop-shadow(0 4px 12px rgba(8,145,178,.3))}
.login-card h1{font-size:22px;font-weight:700;color:var(--ink2);margin-bottom:4px;
  background:linear-gradient(92deg,#0891b2,#7c3aed,#06b6d4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  background-size:200% auto;animation:shimmer 5s linear infinite}
.login-card .sub{color:var(--sub);font-size:13px;margin-bottom:24px}
.login-card input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 16px;font-size:15px;margin-bottom:12px;background:#f8fafc;outline:none;transition:.2s;color:var(--ink)}
.login-card input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px rgba(8,145,178,.1)}
.login-card .remember-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:13px;color:var(--sub);justify-content:flex-start;padding-left:2px}
.login-card .remember-row input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.login-card button{width:100%;height:48px;border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;
  background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:0 6px 24px var(--btn-glow),inset 0 1px 0 rgba(255,255,255,.25)}
.login-card button:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(255,80,20,.65),inset 0 1px 0 rgba(255,255,255,.3)}
.login-card button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.login-err{color:var(--red);font-size:12.5px;min-height:16px;margin-top:8px}

/* App */
#app{display:none;min-height:100vh}
.topbar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;background:rgba(255,255,255,.75);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border-bottom:1px solid rgba(226,232,240,.6);z-index:10}
.brand{display:flex;align-items:center;gap:10px}
.brand .lg{width:36px;height:36px;background:url('logo.png') center/contain no-repeat}
.brand b{font-size:15px;font-weight:700;color:var(--ink2)}
.brand span{font-size:11px;color:var(--accent);background:var(--accent-bg);padding:2px 8px;border-radius:6px;font-weight:600}
.user{display:flex;align-items:center;gap:12px}
.user .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#0891b2,#06b6d4);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(8,145,178,.3)}
.user .info{display:flex;flex-direction:column;align-items:flex-end}
.user .info b{font-size:13px;font-weight:600}
.user .info i{font-size:11px;color:var(--faint);font-style:normal}
.btn-sm{height:34px;padding:0 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card-glass);backdrop-filter:blur(8px);font-size:13px;cursor:pointer;transition:.2s;color:var(--ink);font-weight:500}
.btn-sm:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.btn-accent{background:var(--accent);color:#fff;border:none;box-shadow:0 2px 8px rgba(8,145,178,.25)}
.btn-accent:hover{background:var(--accent2);color:#fff}
.btn-green{background:var(--green);color:#fff;border:none}
.btn-danger{background:var(--red);color:#fff;border:none}

.topbar-right{display:flex;align-items:center;gap:16px}

/* Sidebar */
.app-body{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:230px;flex-shrink:0;background:rgba(255,255,255,.5);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border-right:1px solid rgba(226,232,240,.5);padding:18px 0;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.sidebar-label{font-size:10.5px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:10px 16px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--ink2);cursor:pointer;transition:.2s;margin:0 8px 2px;user-select:none}
.nav-item:hover{background:var(--accent-bg);color:var(--accent)}
.nav-item.active{background:linear-gradient(135deg,#0891b2,#06b6d4);color:#fff;box-shadow:0 4px 14px rgba(8,145,178,.3);font-weight:600}
.nav-item .nav-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.nav-borun{border:2px dashed var(--accent);margin:12px 8px;padding:12px 14px;border-radius:12px;background:var(--accent-bg);cursor:pointer;transition:.2s;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--accent)}
.nav-borun:hover{background:#cffafe;border-color:var(--accent2)}
.nav-borun .nb-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.content-wrap{flex:1;min-width:0;overflow-x:auto}

/* Content */
.content{max-width:1320px;margin:0 auto;padding:28px 24px;animation:fadeInUp .45s ease}
.page-title{font-size:26px;font-weight:800;margin-bottom:4px;letter-spacing:-.5px}
.page-desc{color:var(--sub);font-size:13.5px;margin-bottom:24px}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
.kpi{background:var(--card-glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.6);transition:.2s;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:0;transition:.3s}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.kpi:hover::before{opacity:1}
.kpi .label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-bottom:8px;font-weight:500}
.kpi .label .dot{width:8px;height:8px;border-radius:50%}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-1px;color:var(--ink2)}
.kpi .val .u{font-size:13px;font-weight:500;color:var(--faint);margin-left:3px}
.kpi .sub{font-size:11.5px;color:var(--faint);margin-top:4px}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.kpi-row{grid-template-columns:repeat(2,1fr)}}

/* Charts */
.chart-card{background:var(--card-glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.6);padding:24px;margin-bottom:20px}
.chart-card h3{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.chart-legend{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.chart-legend span{font-size:12px;display:flex;align-items:center;gap:6px}
.chart-legend span::before{content:"";width:12px;height:3px;border-radius:2px;display:inline-block}
.chart-wrap{position:relative;width:100%;height:300px}
.chart-canvas{width:100%;height:100%}

/* Group cards */
.group-card{background:var(--card-glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;border:1px solid rgba(255,255,255,.6);transition:.2s}
.group-card:hover{box-shadow:var(--shadow-lg)}
.group-card .gc-head{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.group-card .gc-head:hover{background:rgba(0,0,0,.01)}
.group-card .gc-info{display:flex;align-items:center;gap:14px}
.group-card .gc-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#0891b2,#06b6d4);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.group-card .gc-name{font-size:17px;font-weight:700}
.group-card .gc-meta{font-size:12px;color:var(--faint);margin-top:2px}
.group-card .gc-stats{display:flex;gap:24px}
.group-card .gc-stat{text-align:center}
.group-card .gc-stat .sv{font-size:20px;font-weight:700;color:var(--ink2)}
.group-card .gc-stat .sl{font-size:11px;color:var(--sub)}
.group-card .gc-arrow{font-size:18px;color:var(--faint);transition:.2s}
.group-card.open .gc-arrow{transform:rotate(180deg)}
.group-card .gc-body{display:none;padding:0 22px 20px}
.group-card.open .gc-body{display:block}

/* Supervisor cards */
.sup-card-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-bottom:24px}
.sup-card{background:var(--card-glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;transition:.2s;border:1.5px solid transparent;cursor:pointer}
.sup-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.sup-card .sc-name{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sup-card .sc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sup-card .sc-stat{text-align:center;padding:8px 4px;background:var(--bg2);border-radius:10px}
.sup-card .sc-stat .sv{font-size:18px;font-weight:700;color:var(--ink2)}
.sup-card .sc-stat .sl{font-size:10.5px;color:var(--sub);margin-top:2px}
.sup-card .sc-rates{display:flex;gap:10px;margin-bottom:12px;font-size:12px}
.sup-card .sc-rate{padding:4px 10px;border-radius:8px;font-weight:600}
.sup-card .sc-btn{width:100%;height:36px;border:none;border-radius:10px;background:linear-gradient(135deg,#0891b2,#06b6d4);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;box-shadow:0 2px 8px rgba(8,145,178,.2)}
.sup-card .sc-btn:hover{box-shadow:0 4px 16px rgba(8,145,178,.35)}

/* Table */
.table-card{background:var(--card-glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:24px;border:1px solid rgba(255,255,255,.6)}
.table-card .tc-head{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.table-card .tc-head h3{font-size:15px;font-weight:700}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:12px;color:var(--sub);font-weight:600;border-bottom:1px solid var(--line);background:rgba(248,250,252,.5)}
td{padding:12px 16px;font-size:13.5px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(236,254,255,.3)}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
.tag-accent{background:var(--accent-bg);color:var(--accent)}
.tag-green{background:var(--green-bg);color:var(--green)}
.tag-purple{background:var(--purple-bg);color:var(--purple)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s ease}
.modal-overlay.show{opacity:1;visibility:visible}
.modal{background:var(--card);border-radius:22px;padding:0;width:500px;max-width:92vw;max-height:90vh;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.3);opacity:0;visibility:hidden;transform:translate(-50%,-50%) translateY(-20px) scale(.94);position:fixed;top:50%;left:50%;transition:.35s cubic-bezier(.22,.61,.36,1)}
.modal-overlay.show .modal{opacity:1;visibility:visible;transform:translate(-50%,-50%) translateY(0) scale(1)}
.modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.9);cursor:grab;user-select:none;border-radius:22px 22px 0 0;position:sticky;top:0;z-index:1}
.modal-header h3{font-size:17px;font-weight:700}
.modal-header .modal-x{width:30px;height:30px;border:none;background:var(--bg);border-radius:9px;font-size:15px;cursor:pointer;color:var(--faint);transition:.2s;display:flex;align-items:center;justify-content:center}
.modal-header .modal-x:hover{background:#e5e5e8;color:var(--ink)}
.modal-body{padding:22px 26px;max-height:calc(90vh - 60px);overflow-y:auto}
.modal-body .field{margin-bottom:14px}
.modal-body .field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px;font-weight:600}
.modal-body .field input,.modal-body .field select{width:100%;height:42px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;font-size:14px;outline:none;transition:.2s;background:#f8fafc;color:var(--ink)}
.modal-body .field input:focus,.modal-body .field select:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px rgba(8,145,178,.1)}
.modal-body .field-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.modal-body .btns{display:flex;gap:10px;margin-top:8px}
.modal-body .btns button{flex:1;height:40px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:.2s}
.modal-body .btn-cancel{background:#f1f5f9;color:var(--sub)}
.modal-body .btn-confirm{background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;box-shadow:0 4px 16px var(--btn-glow)}
.modal-body .err{color:var(--red);font-size:12.5px;min-height:16px;margin-top:6px;font-weight:500}

/* Toast */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(120px);background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;padding:12px 28px;border-radius:28px;font-size:13px;z-index:300;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.3);font-weight:500}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:linear-gradient(135deg,#dc2626,#b91c1c)}

function ubtoa(s){var b=[],i,c;for(i=0;i<s.length;i++){c=s.charCodeAt(i);if(c<128)b.push(c);else if(c<2048)b.push(192|(c>>6),128|(c&63));else b.push(224|(c>>12),128|((c>>6)&63),128|(c&63));}return btoa(String.fromCharCode.apply(null,b));}
function uatob(s){var bin=atob(s),b=[],i=0,j=0,r="";for(j=0;j<bin.length;j++)b.push(bin.charCodeAt(j));while(i<b.length){var c=b[i];if(c<128){r+=String.fromCharCode(c);i++;}else if(c<224){r+=String.fromCharCode(((c&31)<<6)|(b[i+1]&63));i+=2;}else{r+=String.fromCharCode(((c&15)<<12)|((b[i+1]&63)<<6)|(b[i+2]&63));i+=3;}}return r;}

function getTrends(tk,q){
  var u=verify(tk);if(!u)return[401,{error:"未登录"}];
  var t_=ts(),mo=q.month||t_.slice(0,7),role=u.role,ids=[];
  if(role==="boss"){ids=D.users.filter(function(x){return x.role==="supervisor"||x.role==="team_member";}).map(function(x){return x.id;});}else{ids=[u.id];}
  var recs=D.records.filter(function(r){return ids.indexOf(r.user_id)>=0;});
  function bmd(ym){var p_=ym.split("-").map(Number),dim=new Date(p_[0],p_[1],0).getDate(),dy=[];for(var d=1;d<=dim;d++){var ds=ym+"-"+String(d).padStart(2,"0"),drs=recs.filter(function(r){return r.date===ds;}),l=0,pl=0,el=0,ta=0,ea=0;drs.forEach(function(r){l+=r.leads||0;pl+=r.pass_leads||0;el+=r.eff_leads||0;ta+=r.total_arrive||0;ea+=r.eff_arrive||0;});dy.push({date:ds,day:d,leads:l,pass_leads:pl,eff_leads:el,total_arrive:ta,eff_arrive:ea});}return{daily:dy,total:{leads:dy.reduce(function(s,d){return s+d.leads;},0),pass_leads:dy.reduce(function(s,d){return s+d.pass_leads;},0),eff_leads:dy.reduce(function(s,d){return s+d.eff_leads;},0),total_arrive:dy.reduce(function(s,d){return s+d.total_arrive;},0),eff_arrive:dy.reduce(function(s,d){return s+d.eff_arrive;},0)}};}
  var cur=bmd(mo);
  if(q.mode==="year"){
    var ys=q.year||new Date().getFullYear();
    var months=[];
    for(var mi=1;mi<=12;mi++){
      var ym=ys+"-"+String(mi).padStart(2,"0");
      var md=bmd(ym);
      months.push({month:ym,label:mi+"月",leads:md.total.leads,eff_leads:md.total.eff_leads,total_arrive:md.total.total_arrive,eff_arrive:md.total.eff_arrive});
    }
    return[200,{month:mo,daily:cur.daily,year:ys,months:months}];
  }
  if(q.mode==="range"&&q.start&&q.end){
    var range=[];
    var d0=new Date(q.start),d1=new Date(q.end);
    for(var dt=new Date(d0);dt<=d1;dt.setDate(dt.getDate()+1)){
      var ds=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
      var drs=recs.filter(function(r){return r.date===ds;});
      var l=0,pl=0,el=0,ta=0,ea=0;
      drs.forEach(function(r){l+=r.leads||0;pl+=r.pass_leads||0;el+=r.eff_leads||0;ta+=r.total_arrive||0;ea+=r.eff_arrive||0;});
      range.push({date:ds,leads:l,pass_leads:pl,eff_leads:el,total_arrive:ta,eff_arrive:ea});
    }
    return[200,{month:mo,daily:cur.daily,range:range,start:q.start,end:q.end}];
  }
  return[200,{month:mo,daily:cur.daily}];
}

function route(method,path,tk,body,q){
  var pp=path.split("/");
  if(path==="/api/login"&&method==="POST")return postLogin(body);
  if(path==="/api/me"&&method==="GET")return getMe(tk);
  if(path==="/api/dashboard"&&method==="GET")return getDashboard(tk);
  if(path==="/api/supervisors"&&method==="POST")return postSupervisors(tk,body);
  if(path==="/api/bosses"&&method==="POST")return postBoss(tk,body);
  if(path==="/api/members"&&method==="POST")return postMember(tk,body);
  if(path==="/api/records"&&method==="POST")return postRecords(tk,body);
  if(path==="/api/records"&&method==="GET")return getRecords(tk,q);
  if(path==="/api/change_pwd"&&method==="POST")return postChangePwd(tk,body);
  if(path==="/api/accounts"&&method==="GET")return getAccounts(tk);
  if(path==="/api/bosses"&&method==="GET")return getBosses(tk);
  if(path==="/api/trends"&&method==="GET")return getTrends(tk,q);
  if(path==="/api/borun-creds"&&method==="GET")return getBorunCreds(tk);
  if(path==="/api/borun-creds"&&method==="POST")return saveBorunCreds(tk,body);
  if(pp[1]==="api"&&pp[2]==="supervisors"&&pp.length===4&&method==="DELETE")return delSupervisor(tk,pp[3]);
  if(pp[1]==="api"&&pp[2]==="bosses"&&pp.length===4&&method==="DELETE")return delBoss(tk,pp[3]);
  if(pp[1]==="api"&&pp[2]==="members"&&pp.length===4&&method==="DELETE")return delMember(tk,pp[3]);
  return[404,{error:"Not found"}];
}

var _of=window.fetch;
window.fetch=function(url,opts){
  var us=(typeof url==="string")?url:(url.url||url.toString());
  // 只拦截本地相对路径 /api/ 开头的请求；博润的完整 URL（https://...）直接放行
  if(us.indexOf("/api/")===0){
    var m=(opts&&opts.method)||"GET",tk="";
    if(opts&&opts.headers){var ah=opts.headers.Authorization||opts.headers.authorization||"";if(ah.indexOf("Bearer ")===0)tk=ah.slice(7);}
    var body={};try{if(opts&&opts.body)body=JSON.parse(opts.body);}catch(e){}
    var up=us,q={};
    if(us.indexOf("?")>0){var pa=us.split("?");up=pa[0];pa[1].split("&").forEach(function(p_){var kv=p_.split("=");if(kv.length===2)q[kv[0]]=decodeURIComponent(kv[1]);});}
    var result=route(m,up,tk,body,q);
    return Promise.resolve(new Response(JSON.stringify(result[1]),{status:result[0],headers:{"Content-Type":"application/json"}}));
  }
  return _of.call(window,url,opts);
};

const TOKEN_KEY="borun_token",REM_KEY="borun_remember";
function getToken(){return localStorage.getItem(TOKEN_KEY)||"";}
function setToken(t){localStorage.setItem(TOKEN_KEY,t);}
function clearToken(){localStorage.removeItem(TOKEN_KEY);}

async function apiJSON(path,opts){
  var headers={"Content-Type":"application/json"};
  if(opts&&opts.headers)for(var k in opts.headers)headers[k]=opts.headers[k];
  var tk=getToken();if(tk)headers["Authorization"]="Bearer "+tk;
  var res=await fetch(path,Object.assign({method:"GET"},opts||{},{headers:headers}));
  var data={};try{data=await res.json();}catch(_){}
  if(!res.ok)throw new Error((data&&data.error)||"请求失败("+res.status+")");
  return data;
}
var apiGet=function(p){return apiJSON(p,{method:"GET"});};
var apiPost=function(p,b){return apiJSON(p,{method:"POST",body:JSON.stringify(b)});};
var apiDel=function(p){return apiJSON(p,{method:"DELETE"});};

async function tryLogin(){
  var u=document.getElementById("loginUser").value.trim();
  var p=document.getElementById("loginPwd").value;
  var rem=document.getElementById("loginRemember").checked;
  var errEl=document.getElementById("loginErr"),btn=document.getElementById("loginBtn");
  if(!u||!p){errEl.textContent="请填写账号和密码";return;}
  errEl.textContent="";btn.disabled=true;btn.textContent="登录中…";
  try{
    var res=await apiPost("/api/login",{username:u,password:p});
    if(!res.token)throw new Error("登录失败");
    setToken(res.token);STATE.user=res.user;
    if(rem){localStorage.setItem(REM_KEY,JSON.stringify({u:u,p:p}));}else{localStorage.removeItem(REM_KEY);}
    showApp();
  }catch(e){errEl.textContent=e.message;btn.disabled=false;btn.textContent="登 录";}

(function(){
  var mouse={x:-999,y:-999},smooth={x:-999,y:-999},raf=null;
  var reveal=document.getElementById('lReveal');
  if(!reveal)return;
  window.addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;});
  function loop(){
    var loginEl=document.getElementById('login');
    if(!loginEl||loginEl.style.display==='none'){raf=null;return;}
    smooth.x+=(mouse.x-smooth.x)*0.09;smooth.y+=(mouse.y-smooth.y)*0.09;
    reveal.style.setProperty('--mx',Math.round(smooth.x)+'px');
    reveal.style.setProperty('--my',Math.round(smooth.y)+'px');
    raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop);
})();

async function drawBossTrend(mode,a,b){
  var canvas=document.getElementById("bossTrendCanvas");
  if(!canvas)return;
  var url="/api/trends?mode="+mode;
  if(mode==="month")url+="&month="+a;
  else if(mode==="year")url+="&year="+a;
  else url+="&start="+a+"&end="+b;
  var data=await apiGet(url);
  var daily=null;
  if(mode==="year")daily=data.months||[];
  else if(mode==="range")daily=data.range||[];
  else daily=data.daily||[];
  var ctx=canvas.getContext("2d");
  var W=canvas.parentElement.clientWidth||700,H=300;
  canvas.width=W;canvas.height=H;
  ctx.clearRect(0,0,W,H);
  if(!daily||daily.length===0){ctx.fillStyle="#94a3b8";ctx.font="14px sans-serif";ctx.textAlign="center";ctx.fillText("暂无数据",W/2,H/2);return;}
  var metrics=["leads","eff_leads","total_arrive","eff_arrive"];
  var colors={"leads":"#0891b2","eff_leads":"#7c3aed","total_arrive":"#ea580c","eff_arrive":"#dc2626"};
  var maxVal=0;
  daily.forEach(function(d){metrics.forEach(function(m){maxVal=Math.max(maxVal,d[m]||0);});});
  maxVal=Math.ceil(maxVal*1.2/10)*10||10;
  var pL=50,pR=15,pT=20,pB=35,cW=W-pL-pR,cH=H-pT-pB;
  ctx.strokeStyle="#e2e8f0";ctx.lineWidth=1;ctx.font="11px sans-serif";ctx.fillStyle="#94a3b8";ctx.textAlign="right";
  for(var i=0;i<=5;i++){var y=pT+(cH/5)*i,val=Math.round(maxVal*(5-i)/5);ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(W-pR,y);ctx.stroke();ctx.fillText(val,pL-8,y+4);}
  ctx.textAlign="center";
  var step=Math.max(1,Math.floor(daily.length/8));
  daily.forEach(function(d,i){
    if(i%step===0||i===daily.length-1){
      var label=mode==="year"?d.label:(d.day||d.date||"").toString().slice(5);
      ctx.fillText(label,pL+(cW/(daily.length-1||1))*i,H-pB+16);
    }
  });
  metrics.forEach(function(m){
    ctx.strokeStyle=colors[m];ctx.lineWidth=2.5;ctx.beginPath();
    daily.forEach(function(d,i){var x=pL+(cW/(daily.length-1||1))*i,y=pT+cH-(d[m]||0)/maxVal*cH;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
    ctx.stroke();
    var dotStep=Math.max(1,Math.floor(daily.length/20));
    daily.forEach(function(d,i){
      if(i%dotStep===0||i===daily.length-1){
        var x=pL+(cW/(daily.length-1||1))*i,y=pT+cH-(d[m]||0)/maxVal*cH;
        ctx.fillStyle=colors[m];ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
      }
    });
  });
}

async function drawSupTrend(){
  var canvas=document.getElementById("supTrendCanvas");
  if(!canvas)return;
  var today=new Date();var month=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0");
  var data=await apiGet("/api/trends?month="+month);
  var daily=data.daily||[];
  var ctx=canvas.getContext("2d");
  var W=canvas.parentElement.clientWidth||700;var H=280;
  canvas.width=W;canvas.height=H;
  ctx.clearRect(0,0,W,H);
  if(daily.length===0){ctx.fillStyle="#94a3b8";ctx.font="14px sans-serif";ctx.textAlign="center";ctx.fillText("暂无数据",W/2,H/2);return;}
  var metrics=["leads","eff_leads","total_arrive","eff_arrive"];
  var colors={"leads":"#0891b2","eff_leads":"#7c3aed","total_arrive":"#ea580c","eff_arrive":"#dc2626"};
  var labels={"leads":"总线索","eff_leads":"有效线索","total_arrive":"总到诊","eff_arrive":"有效到诊"};
  var maxVal=0;daily.forEach(function(d){metrics.forEach(function(m){maxVal=Math.max(maxVal,d[m]||0);});});
  maxVal=Math.ceil(maxVal*1.2/10)*10||10;
  var pL=50,pR=15,pT=20,pB=35,cW=W-pL-pR,cH=H-pT-pB;
  ctx.strokeStyle="#e2e8f0";ctx.lineWidth=1;ctx.font="11px sans-serif";ctx.fillStyle="#94a3b8";ctx.textAlign="right";
  for(var i=0;i<=5;i++){var y=pT+(cH/5)*i,val=Math.round(maxVal*(5-i)/5);ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(W-pR,y);ctx.stroke();ctx.fillText(val,pL-8,y+4);}
  ctx.textAlign="center";
  var step=Math.max(1,Math.floor(daily.length/8));
  daily.forEach(function(d,i){if(i%step===0||i===daily.length-1){ctx.fillText(d.day,pL+(cW/(daily.length-1||1))*i,H-pB+16);}});
  metrics.forEach(function(m){
    ctx.strokeStyle=colors[m];ctx.lineWidth=2.5;ctx.beginPath();
    daily.forEach(function(d,i){var x=pL+(cW/(daily.length-1||1))*i,y=pT+cH-(d[m]||0)/maxVal*cH;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
    ctx.stroke();
  });
}

function borunSetRange(kind){
  var t=new Date(),y=t.getFullYear(),m=t.getMonth(),d=t.getDate();
  function pad(n){return String(n).padStart(2,'0');}
  function iso(yy,mm,dd){return yy+'-'+pad(mm+1)+'-'+pad(dd);}
  if(kind==='today'){BORUN.timeStart=iso(y,m,d);BORUN.timeEnd=iso(y,m,d);}
  else if(kind==='week'){
    var dow=(t.getDay()+6)%7; // 周一起始
    var ms=new Date(y,m,d-dow),me=new Date(y,m,d-dow+6);
    BORUN.timeStart=iso(ms.getFullYear(),ms.getMonth(),ms.getDate());
    BORUN.timeEnd=iso(me.getFullYear(),me.getMonth(),me.getDate());
  }
  else if(kind==='month'){BORUN.timeStart=iso(y,m,1);BORUN.timeEnd=iso(y,m,new Date(y,m+1,0).getDate());}
  else if(kind==='year'){BORUN.timeStart=y+'-01-01';BORUN.timeEnd=y+'-12-31';}
  // 高亮当前按钮
  var btns=document.querySelectorAll('.bp-time-btn');
  btns.forEach(function(b){b.style.background='';b.style.color='';});
  if(kind!=='custom'){
    btns.forEach(function(b){if(b.getAttribute('data-kind')===kind){b.style.background='#0891b2';b.style.color='#fff';}});
  }
  borunLoadData(document.getElementById('bp_result'));
}

  if(!s||!e){toast('请选择起止日期','err');return;}

  borunLoadData(document.getElementById('bp_result'));
}

async function borunFillToday(){
  if(!BORUN.data){toast('请先登录博润','err');return;}
  var t=BORUN.total||{count:0,orderCount:0,orderArriveCount:0,successCount:0};
  var date=BORUN.timeEnd||new Date().toISOString().slice(0,10);
  var d={user_id:STATE.user.id,date:date,
    leads:t.count||0,
    pass_leads:t.orderCount||0,
    eff_leads:t.orderArriveCount||0,
    total_arrive:(t.orderArriveCount||0)+(t.orderNoArriveCount||0),
    eff_arrive:t.successCount||0,
    note:'博润同步 '+BORUN.timeStart+'~'+BORUN.timeEnd};
  try{
    await apiPost('/api/records',d);
    toast('✅ 已填入 '+date+' 数据');
    closeModal();
    navTo(CURRENT_PAGE);
  }catch(e){toast(e.message,'err');}
}

// ===== TREND CHART =====
var trendMonth=todayStr().slice(0,7);
async function openTrendModal(){
  var h="<div class=\"modal-title\">📈 趋势分析</div>";
  h+="<div class=\"trend-month-bar\"><div class=\"mb-nav\"><button class=\"mb-btn\" onclick=\"trendMonthShift(-1)\">◀</button><span class=\"mb-label\" id=\"tm_label\">"+trendMonth+"</span><button class=\"mb-btn\" onclick=\"trendMonthShift(1)\">▶</button></div></div>";
  h+="<div class=\"chart-legend\"><span style=\"color:#0891b2\">● 总线索</span><span style=\"color:#059669\">● 通过线索</span><span style=\"color:#7c3aed\">● 有效线索</span><span style=\"color:#ea580c\">● 总到诊</span><span style=\"color:#dc2626\">● 有效到诊</span></div>";
  h+="<div class=\"trend-chart-box\"><canvas id=\"trendCanvas\" width=\"700\" height=\"300\"></canvas></div>";
  h+="<div class=\"trend-rates\" id=\"trendRates\"></div>";
  showModal(h,"trend-modal");
  await loadTrendChart();
}
async function trendMonthShift(dir){var p=trendMonth.split("-").map(Number);var d=new Date(p[0],p[1]-1+dir,1);trendMonth=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");document.getElementById("tm_label").textContent=trendMonth;await loadTrendChart();}
async function loadTrendChart(){
  var data=await apiGet("/api/trends?month="+trendMonth);
  var daily=data.daily||[];
  var canvas=document.getElementById("trendCanvas");
  if(!canvas)return;
  var ctx=canvas.getContext("2d");
  var parent=canvas.parentElement;
  var W=parent.clientWidth-32;var H=300;
  canvas.width=W;canvas.height=H;
  ctx.clearRect(0,0,W,H);
  if(daily.length===0){ctx.fillStyle="#94a3b8";ctx.font="14px sans-serif";ctx.textAlign="center";ctx.fillText("暂无数据",W/2,H/2);return;}

  var metrics=["leads","pass_leads","eff_leads","total_arrive","eff_arrive"];
  var colors={"leads":"#0891b2","pass_leads":"#059669","eff_leads":"#7c3aed","total_arrive":"#ea580c","eff_arrive":"#dc2626"};
  var labels={"leads":"总线索","pass_leads":"通过线索","eff_leads":"有效线索","total_arrive":"总到诊","eff_arrive":"有效到诊"};

  var maxVal=0;daily.forEach(function(d){metrics.forEach(function(m){maxVal=Math.max(maxVal,d[m]||0);});});maxVal=Math.ceil(maxVal*1.2/10)*10||10;
  var pL=55,pR=20,pT=25,pB=35,cW=W-pL-pR,cH=H-pT-pB;

  // Grid
  ctx.strokeStyle="#e2e8f0";ctx.lineWidth=1;ctx.font="11px sans-serif";ctx.fillStyle="#94a3b8";ctx.textAlign="right";
  for(var i=0;i<=5;i++){var y=pT+(cH/5)*i,val=Math.round(maxVal*(5-i)/5);ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(W-pR,y);ctx.stroke();ctx.fillText(val,pL-8,y+4);}

  // X axis
  ctx.textAlign="center";ctx.fillStyle="#94a3b8";
  var step=Math.max(1,Math.floor(daily.length/8));
  daily.forEach(function(d,i){if(i%step===0||i===daily.length-1){ctx.fillText(d.day,pL+(cW/(daily.length-1||1))*i,H-pB+16);}});

  // Draw lines
  metrics.forEach(function(m){
    ctx.strokeStyle=colors[m];ctx.lineWidth=2.5;ctx.beginPath();
    daily.forEach(function(d,i){var x=pL+(cW/(daily.length-1||1))*i,y=pT+cH-(d[m]||0)/maxVal*cH;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();
    // Dot every N points
    var dotStep=Math.max(1,Math.floor(daily.length/20));
    daily.forEach(function(d,i){if(i%dotStep===0||i===daily.length-1){var x=pL+(cW/(daily.length-1||1))*i,y=pT+cH-(d[m]||0)/maxVal*cH;var prevVal=i>0?(daily[i-1][m]||0):(d[m]||0);var currVal=d[m]||0;var diff=currVal-prevVal,dirColor=Math.abs(diff)<(maxVal*0.03)?"#d97706":diff>0?"#059669":"#dc2626";ctx.fillStyle=colors[m];ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();ctx.fillStyle=dirColor;ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill();}});
  });

  // Monthly rates
  var mt={leads:0,pass_leads:0,eff_leads:0,total_arrive:0,eff_arrive:0};
  daily.forEach(function(d){metrics.forEach(function(m){mt[m]+=d[m]||0;});});
  var monEffRate=mt.leads>0?Math.round(mt.eff_leads/mt.leads*1000)/10:0;
  var monArrRate=mt.total_arrive>0?Math.round(mt.eff_arrive/mt.total_arrive*1000)/10:0;
  document.getElementById("trendRates").innerHTML=
    "<div class=\"trend-rate-card\"><div class=\"trc-val\">"+fmt(mt.leads)+"</div><div class=\"trc-label\">本月总线索</div></div>"+
    "<div class=\"trend-rate-card\"><div class=\"trc-val\">"+fmt(mt.eff_leads)+"</div><div class=\"trc-label\">本月有效线索</div></div>"+
    "<div class=\"trend-rate-card\"><div class=\"trc-val\" style=\"color:#059669\">"+pctStr(monEffRate)+"</div><div class=\"trc-label\">有效率</div></div>"+
    "<div class=\"trend-rate-card\"><div class=\"trc-val\" style=\"color:#dc2626\">"+pctStr(monArrRate)+"</div><div class=\"trc-label\">到诊率</div></div>";
}

// ===== MODAL =====
function showModal(body,cls){
  var root=document.getElementById("modalRoot");
  root.innerHTML="<div class=\"modal-overlay show\" onclick=\"closeModal()\"><div class=\"modal"+(cls?" "+cls:"")+"\" onclick=\"event.stopPropagation()\"><div class=\"modal-header\"><h3 id=\"modalTitle\">操作</h3><button class=\"modal-x\" onclick=\"closeModal()\">✕</button></div><div class=\"modal-body\">"+body+"</div></div></div>";
  var m=body.match(/<div class="modal-title">([\s\S]*?)<\/div>/);
  if(m)document.getElementById("modalTitle").innerHTML=m[1];
}
function closeModal(){document.getElementById("modalRoot").innerHTML="";}

function showPwdModal(){showModal("<div class=\"modal-title\">修改密码</div><div class=\"field\"><label>旧密码</label><input id=\"cp_old\" type=\"password\"></div><div class=\"field\"><label>新密码</label><input id=\"cp_new\" type=\"password\"></div><div class=\"btns\"><button class=\"btn-cancel\" onclick=\"closeModal()\">取消</button><button class=\"btn-confirm\" onclick=\"changePwd()\">确认</button></div><div class=\"err\" id=\"cp_err\"></div>");}
